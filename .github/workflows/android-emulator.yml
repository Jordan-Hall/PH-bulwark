name: android-emulator

# A "real Android box" in CI: builds the child APK (incl. an x86_64 native lib so
# the JNI loads on the emulator), boots an Android emulator, installs the app, and
# launches it — proving the app actually RUNS on a real Android runtime (loads
# libaegis_client.so, starts MainActivity) and doesn't crash on launch.
#
# Non-blocking (not a required check): the emulator is slow (~10-15 min) and can be
# flaky, so it informs without gating merges. Runs on Android changes + manual.
# NOTE: this smoke-tests launch + JNI load. The VpnService/Accessibility flows need
# user grants a bare launch can't give — full device validation is still manual.

on:
  workflow_dispatch: {}
  push:
    paths:
      - "platform/android/**"
      - "crates/**"
      - ".github/workflows/android-emulator.yml"

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  smoke:
    name: APK boots + runs on emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
      - name: Install NDK + export its path
        run: |
          sdkmanager "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - name: Set up Rust + Android targets (incl. x86_64 for the emulator)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build JNI libs (arm64 + armv7 + x86_64) into jniLibs
        working-directory: platform/android/rust/aegis-android
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../../app/src/main/jniLibs build --release
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK (incl. x86_64 for the emulator)
        working-directory: platform/android
        env:
          EMULATOR_X86: "1"
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Enable KVM (emulator acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Boot emulator, install, launch, assert no crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -uo pipefail
            # Wait for the device to be fully booted (avoids the "device offline" race).
            adb wait-for-device
            timeout 120 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done' || true
            adb install -r platform/android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c || true
            # Launch MainActivity and WAIT for the result (-W reports Status: ok/error).
            OUT=$(adb shell am start -W -n co.libertyware.aegis/.MainActivity 2>&1 || true)
            echo "$OUT"
            sleep 8
            echo "=== app logcat ==="
            adb logcat -d 2>/dev/null | grep -iE "aegis|libaegis|RustBridge|AndroidRuntime" | tail -40 || true
            # HARD FAIL only on a real crash (native lib load failure / uncaught exception).
            if adb logcat -d 2>/dev/null | grep -E "FATAL EXCEPTION|UnsatisfiedLinkError"; then
              echo "::error::app crashed on launch (native lib / uncaught exception)"; exit 1
            fi
            # Success = the launcher activity started cleanly + no crash. (A launcher
            # activity may finish/background, so process-liveness is informational only.)
            if echo "$OUT" | grep -q "Status: ok"; then
              echo "✓ MainActivity launched + libaegis_client loaded, no crash"
            elif adb shell pidof co.libertyware.aegis >/dev/null 2>&1; then
              echo "✓ app process alive, no crash"
            else
              echo "::error::MainActivity did not launch (am start: $OUT)"; exit 1
            fi
