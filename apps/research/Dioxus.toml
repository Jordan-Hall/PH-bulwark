# Predator Hunters Research — Dioxus 0.8 web bundle config.
#
# The stylesheet is shipped through dx's asset system (asset!("/assets/main.css")
# + document::Stylesheet in app.rs), so it lands in the document <head> with a
# hashed, cacheable URL and the browser has it before first paint. Client-side
# routing uses the History API, so the host falls back to index.html for unknown
# paths (see the deploy Caddyfile).

[application]
name = "Predator Hunters Research"

[web.app]
title = "Predator Hunters Research — child-safety AI"
base_path = "/"
