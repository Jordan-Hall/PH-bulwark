[package]
name = "bulwark-store"
version.workspace = true
edition.workspace = true
license.workspace = true

# bulwark-store — the `Store` trait (interfaces.md) with three backends:
#   * client/local (default): pure-Rust `portable` (no C toolchain, builds anywhere)
#   * client/local (opt-in):  encrypted SQLite via SQLCipher (rusqlite)
#   * server/cluster:         Postgres via `sqlx`
#
# DATA-HANDLING MANDATE (docs/security/data-handling.md):
#   This crate persists C1/C3 data ONLY — verdict + reason codes + hashes +
#   safe-thumbnail *references* + metadata. It NEVER persists C0 (message text,
#   explicit media bytes, raw decrypted bodies). The schema is shaped to make
#   that invariant structural: there is no column able to hold message text or
#   media bytes, and a unit test asserts it. Encryption-at-rest + retention
#   auto-purge + a tamper-evident hash-chained audit log are required here.
#
# NO AI/ML in this crate. NO telemetry.

[features]
# The DEFAULT pairs the pure-Rust `portable` client backend (no C toolchain, so
# `cargo build` works on every host incl. locked-down Windows) with the Postgres
# server adapter. Opt into native SQLite for durable on-disk client storage.
default = ["portable", "postgres"]
# Pure-Rust, dependency-free client/local backend (in-memory + optional JSON
# persistence). Builds on ANY host with no C toolchain — including Windows under
# Smart App Control, where the bundled-SQLite C compile is blocked (os error
# 4551). Same Store contract + tamper-evident audit hash chain + retention.
portable = []
# Client/local SQLite backend (opt-in). Plain `bundled` SQLite; persists ONLY
# metadata/hashes (never content, by schema invariant): at-rest = OS disk
# encryption + age exports. On Smart-App-Control Windows hosts prefer `portable`.
sqlite = ["dep:rusqlite"]
# Server/cluster shared-state Postgres backend.
postgres = ["dep:sqlx"]
# OPT-IN: SQLCipher page-level at-rest encryption (non-Windows). Also switch the
# rusqlite `bundled` feature to `bundled-sqlcipher` below; needs a SQLCipher build
# (system OpenSSL). Gates the `PRAGMA key` in sqlite.rs::init_conn. Implies sqlite.
sqlcipher = ["sqlite"]

[dependencies]
bulwark-proto = { path = "../bulwark-proto" }
bulwark-core = { path = "../bulwark-core" }

serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true

# At-rest encryption. SQLCipher (below) encrypts the SQLite page store; `ring`
# additionally provides the SHA-256 used by the tamper-evident audit hash-chain
# and content hashing, and `age` is used for encrypted *exports/backups*
# (data-handling.md §3 "Persist": exports are age-encrypted, keys owner-held).
ring.workspace = true
age.workspace = true

# Client/local SQLite backend (OPT-IN via the `sqlite` feature). The default is
# the pure-Rust `portable` backend, so this is NOT pulled by a plain `cargo build`
# — which lets the crate build on hosts with no C toolchain (Windows under Smart
# App Control, where the bundled `sqlite3.c` compile is blocked, os error 4551).
# `bundled` statically links SQLite; pinned below the libsqlite3-sys 0.38
# `cfg_select` break. For at-rest encryption switch `bundled` -> `bundled-sqlcipher`
# and build `--features sqlcipher` (non-Windows; needs a SQLCipher/OpenSSL build).
rusqlite = { version = "0.32", features = ["bundled", "blob"], optional = true }

# Server/cluster backend: Postgres shared state. at-rest encryption is provided
# by the database/volume (data-handling.md §3); access is restricted by mTLS.
sqlx = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
