# cargo-deny configuration — supply-chain + license gate (run `cargo deny check`).
# License policy: permissive only. ffmpeg is SHELLED OUT (sidecar), never linked,
# so GPL/LGPL must NOT appear in the dependency graph.

[advisories]
version = 2
yanked = "deny"
# Unmaintained-ONLY notices (no vulnerability, no safe upgrade): ubiquitous
# transitive proc-macro deps we can't realistically drop. We still deny real
# vulnerabilities + yanked crates; this ignores only the unmaintained notices.
# - RUSTSEC-2024-0436: `paste`
# - RUSTSEC-2026-0173: `proc-macro-error2` (via age -> i18n-embed-fl; no safe upgrade)
ignore = ["RUSTSEC-2024-0436", "RUSTSEC-2026-0173"]

[licenses]
version = 2
# Allowed permissive licenses. No GPL / AGPL / LGPL (would taint the binary).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "0BSD",                # quoted_printable (via lettre) — public-domain-equivalent
    "CDLA-Permissive-2.0", # webpki-roots cert bundle DATA license — permissive
]
confidence-threshold = 0.9
# `ring` is Apache-2.0/ISC/MIT-ish with a custom OpenSSL-derived notice; clarify if flagged.
exceptions = [{ name = "ring", allow = ["ISC", "MIT", "OpenSSL"] }]

[bans]
multiple-versions = "warn"
wildcards = "warn"
# Forbid FFI ffmpeg bindings — ffmpeg MUST remain a shelled-out sidecar (license
# isolation, per docs/research/crate-research.md). Use ffmpeg-sidecar only.
deny = [
    { name = "ffmpeg-next" },
    { name = "ffmpeg-sys-next" },
    { name = "ffmpeg-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
