// Bulwark gRPC/protobuf contracts — the single source of truth shared by
// client, server, and cluster nodes so they can never drift.
//
// Transport: tonic gRPC over HTTP/2 with **mTLS** on every link
// (client⇄cluster and worker⇄worker). See docs/design/architecture.md.
//
// PRIVACY / SAFETY INVARIANTS (enforced by message shape, not just policy):
//   * Raw explicit media is NEVER carried back in a Verdict or AlertEvent.
//     `Evidence` deliberately carries ONLY hashes, a SAFE (blurred/cropped)
//     thumbnail, or a redacted text snippet — never the original frame/clip.
//   * Suspected CSAM is flagged, never archived: see Category.CSAM_SUSPECTED
//     and the report-never-store rule in PLAN.md §0c.
//   * Inline media on AnalysisRequest is transient (analysed in memory,
//     never persisted by a worker). Prefer MediaRef where a side channel
//     already holds the bytes.

syntax = "proto3";

package bulwark.v1;

// ---------------------------------------------------------------------------
// Enums
// ---------------------------------------------------------------------------

// What kind of payload a request carries. Drives which analyzer pipeline runs.
enum MediaKind {
  MEDIA_KIND_UNSPECIFIED = 0;
  MEDIA_KIND_TEXT        = 1; // chat / page text / OCR'd on-screen text
  MEDIA_KIND_IMAGE       = 2; // a still image or sampled video frame
  MEDIA_KIND_AUDIO       = 3; // an audio segment (PCM/encoded)
  MEDIA_KIND_VIDEO       = 4; // a buffered video segment (decoded by worker)
}

// Where the captured content originated. Lets policy treat a buffered VOD
// stream differently from a live stream or an on-device OCR capture.
enum SourceChannel {
  SOURCE_CHANNEL_UNSPECIFIED = 0;
  WEB                        = 1; // inspected HTTP(S) page / web chat
  VIDEO_STREAM               = 2; // progressive / HLS / DASH (buffered, delay OK)
  LIVE_STREAM                = 3; // low-latency live (bounded delay budget)
  OCR_ONSCREEN               = 4; // on-device conventional OCR (E2E / pinned apps)
  NOTIFICATION               = 5; // on-device notification text (E2E apps)
}

// Classifier verdict category. SAFE is the explicit negative class so a
// Verdict is always conclusive. GROOMING/CSAM_SUSPECTED come from bulwark-text
// rules+classifier; the ADULT_* come from vision/audio/text analyzers.
enum Category {
  CATEGORY_UNSPECIFIED = 0;
  SAFE                 = 1;
  ADULT_IMAGE          = 2;
  ADULT_AUDIO          = 3;
  ADULT_TEXT           = 4;
  GROOMING             = 5;
  CSAM_SUSPECTED       = 6; // report-never-archive path (PLAN §0c)
  VIOLENCE             = 7;
  SELF_HARM            = 8;
  HATE                 = 9;
}

// Severity bands. Map onto policy thresholds (see model-research §grooming).
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  INFO                 = 1; // log-only, <0.3 score band
  LOW                  = 2; // log, 0.3–0.5
  MEDIUM               = 3; // flag + log, 0.5–0.7
  HIGH                 = 4; // immediate alert + human review, ≥0.7
  CRITICAL             = 5; // CSAM-suspected / safety-critical, escalate now
}

// Action the client should take on the flow/segment. Set by bulwark-policy from
// a Verdict; carried back so the data plane needs no second round trip.
enum Action {
  ACTION_UNSPECIFIED = 0;
  ALLOW              = 1; // forward unchanged
  BLOCK              = 2; // drop / reset the flow or segment
  BLUR               = 3; // re-encode flagged region/frame blurred (video/image)
  MUTE               = 4; // silence flagged audio span
  WARN               = 5; // forward but show an interstitial / overlay
  LOG                = 6; // forward, record for review (borderline)
}

// ONNX execution provider a worker (or local client) used / can use. Mirrors
// `ort` provider names; lets bulwark-infer route by capability and reproduce.
enum ExecutionProvider {
  EXECUTION_PROVIDER_UNSPECIFIED = 0;
  CPU                            = 1; // CPU / oneDNN baseline (always available)
  CUDA                           = 2;
  TENSORRT                       = 3;
  DIRECTML                       = 4; // Windows GPU
  COREML                         = 5; // Apple
  NNAPI                          = 6; // Android
  QNN                            = 7; // Qualcomm
}

// ---------------------------------------------------------------------------
// Common payload messages
// ---------------------------------------------------------------------------

// Inline bytes for analysis. TRANSIENT: analysed in memory, never persisted.
// Keep small; for anything large prefer MediaRef + a side channel.
message InlineMedia {
  bytes  data      = 1; // raw bytes (image/audio/video segment)
  string mime_type = 2; // e.g. "image/jpeg", "audio/L16", "video/mp4"
  uint32 width     = 3; // optional, images/frames
  uint32 height    = 4; // optional, images/frames
  uint64 duration_ms = 5; // optional, audio/video
}

// Reference to media already held by a content-addressed side channel (e.g. a
// worker-local blob cache keyed by hash) so we don't re-ship large payloads.
message MediaRef {
  string uri    = 1; // opaque, cluster-internal (e.g. "blob://<sha256>")
  bytes  sha256 = 2; // content hash; worker rejects on mismatch
  uint64 size   = 3; // bytes
  string mime_type = 4;
}

// A span of text to classify. Carries enough context for the conversation-level
// grooming state machine without shipping whole histories.
message TextSpan {
  string text        = 1; // the message / OCR'd text (already plaintext)
  string lang        = 2; // BCP-47 hint ("en", "es"); empty = detect
  string app         = 3; // originating app/site ("messenger", "example.com")
  string thread_id   = 4; // stable per-conversation id for state correlation
  bool   from_minor  = 5; // true if the supervised child authored it (if known)
  repeated string prior_excerpts = 6; // short redacted context for state machine
}

// ---------------------------------------------------------------------------
// Analysis service
// ---------------------------------------------------------------------------

// One unit of work submitted by a client to the cluster.
message AnalysisRequest {
  string        request_id    = 1; // client-generated idempotency key
  MediaKind     media_kind    = 2;
  SourceChannel source_channel = 3;
  string        device_id     = 4; // supervised device (client cert subject)
  int64         ts            = 5; // capture time, unix epoch millis
  TextSpan      text_span     = 6; // present when media_kind == TEXT

  // Exactly one of the media carriers (for non-text kinds).
  oneof media {
    InlineMedia inline_media = 7;
    MediaRef    media_ref    = 8;
  }

  // Soft deadline so a worker can fast-path / shed under a live-stream budget.
  uint32 deadline_ms = 9;
}

// Hash-only / safe evidence attached to a Verdict for the review UI and alerts.
// INVARIANT: NO raw explicit media here — hashes, a SAFE thumbnail (blurred or
// heavily cropped), or a redacted text snippet ONLY. Never the original frame,
// clip, or unredacted message. CSAM is reported via legal channels, not stored.
message Evidence {
  bytes  sha256          = 1; // content hash of the analysed media
  bytes  perceptual_hash = 2; // pHash for near-dup / known-hash matching
  bytes  safe_thumbnail  = 3; // OPTIONAL blurred/cropped preview — SAFE only
  string text_snippet    = 4; // OPTIONAL redacted excerpt (text verdicts only)
  string model_id        = 5; // which model produced the verdict (auditable)
  string model_version   = 6;
}

// The decision returned for an AnalysisRequest.
message Verdict {
  string   request_id = 1; // echoes AnalysisRequest.request_id
  Category category    = 2;
  Action   action      = 3; // recommended action (policy may override)
  Severity severity    = 4;
  float    score       = 5; // normalized confidence 0.0–1.0
  string   rationale    = 6; // human-readable, explainable (rules cite triggers)
  Evidence evidence     = 7;
  GroomingSignal grooming = 8; // present when category == GROOMING / CSAM_SUSPECTED
  string   worker_id    = 9; // which node served it (observability)
  uint32   latency_ms   = 10; // server-side processing time
  // LOCAL-ONLY `blob://<sha256>` ref to a blocked/borderline VIDEO segment the
  // analyzer retained for guardian review (bulwark-video::SegmentStore). Copied into
  // AlertEvent.local_segment_uri. Empty for non-video / benign / CSAM (never stored).
  string   local_segment_uri = 11;
  // Remediated media bytes when the analyzer softened the clip in place (blurred
  // NSFW frames + muted flagged-speech timecodes), re-packaged in the SAME container
  // with preserved timestamps. The proxy serves these instead of the original.
  // Empty when nothing was remediated. CSAM is never remediated/served — always blocked.
  bytes    remediated_media = 12;
}

// Output of the deterministic grooming rule engine (model-research §grooming).
// The eight indicator categories are explainable and auditable.
message GroomingSignal {
  // Which of the eight rule categories fired, by stable name:
  // "secrecy", "platform_switching", "personal_info_age_probing",
  // "sexualization", "gifts_bribery", "emotional_manipulation",
  // "boundary_testing", "image_request".
  repeated string fired_categories = 1;
  float  score   = 2; // normalized 0.0–1.0 (rule sum + context multipliers)
  string excerpt = 3; // redacted excerpt that triggered the signal
  bool   classifier_backed = 4; // true if small text classifier agreed
}

// Batched analysis (e.g. several sampled frames from one video segment).
message AnalysisBatch {
  repeated AnalysisRequest requests = 1;
}

message VerdictBatch {
  repeated Verdict verdicts = 1;
}

// Client → cluster heavy analysis. Workers are stateless; any node can serve.
service Analysis {
  // Single request → single verdict (web text, one image).
  rpc Analyze(AnalysisRequest) returns (Verdict);
  // Bidirectional stream for live/continuous capture (frames, audio chunks).
  rpc AnalyzeStream(stream AnalysisRequest) returns (stream Verdict);
  // Batched fan-out (sampled frames of a buffered video segment).
  rpc AnalyzeBatch(AnalysisBatch) returns (VerdictBatch);
}

// ---------------------------------------------------------------------------
// Offload service — device-capability negotiation (bulwark-infer ⇄ cluster)
// ---------------------------------------------------------------------------

// What the device can do locally. Drives the local-vs-remote routing decision.
message DeviceProfile {
  string device_id = 1;
  string platform  = 2; // "windows", "linux", "android", "macos"
  string cpu       = 3; // model string / arch
  uint32 cpu_cores = 4;
  uint64 ram_mb    = 5;
  string gpu       = 6; // GPU model string, empty if none
  repeated ExecutionProvider exec_providers = 7; // available, best-first
  int32  battery_pct = 8;   // -1 if on mains / unknown
  bool   on_battery  = 9;
  uint32 rtt_ms      = 10;  // measured RTT to the cluster gateway
  string app_version = 11;
}

// How work should be split between device and cluster. Returned by the cluster
// from a DeviceProfile; the client honours it until RefreshOffload.
message OffloadPolicy {
  // Per-MediaKind routing hint. true = run locally, false = offload to cluster.
  bool run_text_local   = 1; // grooming rules are cheap → usually local
  bool run_image_local  = 2;
  bool run_audio_local  = 3;
  bool run_video_local  = 4; // almost always false on mobile

  // Thresholds the client applies before offloading anyway.
  uint32 max_local_rtt_ms     = 5; // offload preferred above this RTT
  uint32 min_battery_pct      = 6; // below this, force-offload heavy work
  uint32 cluster_queue_backpressure = 7; // est. queue depth → prefer local
  uint32 ttl_secs             = 8; // re-negotiate after this
  repeated ExecutionProvider preferred_local_providers = 9; // best-first to try
  string policy_id            = 10; // for audit / RefreshOffload correlation
}

message RefreshOffloadRequest {
  string device_id = 1;
  string policy_id = 2; // current policy held by the client
  uint32 rtt_ms    = 3; // fresh measurement
  int32  battery_pct = 4;
}

service Offload {
  rpc NegotiateOffload(DeviceProfile) returns (OffloadPolicy);
  rpc RefreshOffload(RefreshOffloadRequest) returns (OffloadPolicy);
}

// ---------------------------------------------------------------------------
// AlertRelay service — guardian notifications (client/server → bulwark-alert)
// ---------------------------------------------------------------------------

// Why an alert fired. Two product triggers per PLAN §0/§2.
enum AlertKind {
  ALERT_KIND_UNSPECIFIED = 0;
  INTERVENTION           = 1; // a blocker acted (block/blur/mute)
  GROOMING_SUSPECTED     = 2; // grooming engine crossed alert threshold
  PROTECTION_DISABLED    = 3; // tamper: filtering/admin/accessibility off, app-removal attempt, or missed heartbeat
  CHILD_SOS              = 4; // the child pressed the in-app SOS button — URGENT guardian alert (FamilySafety.RaiseSos)
  SAFETY_BROADCAST       = 5; // staff-issued region-wide family safety notice — staff-originated ONLY, never crowd-sourced
}

// A guardian-facing alert. Carries redacted context ONLY — never explicit media.
message AlertEvent {
  string    alert_id = 1; // idempotency key (dedupe across retries)
  AlertKind kind     = 2;
  Category  category  = 3;
  Severity  severity  = 4;
  string    app       = 5; // app/site involved
  string    device_id = 6;
  int64     ts        = 7; // unix epoch millis
  string    redacted_context = 8; // safe summary / redacted excerpt — NO media
  Evidence  evidence  = 9; // hashes / safe thumbnail only (see Evidence invariant)
  // Per-child routing (Accounts service): which supervised child this alert is
  // about, so the relay fans it out ONLY to that child's assigned guardian(s).
  // Empty = legacy device-only routing (every guardian stream sees it).
  string    child_id  = 10;
  string    family_id = 11; // the family the child belongs to (audit / scoping)

  // LOCAL-ONLY content-addressed reference (`blob://<sha256-hex>`) to a
  // blocked/borderline VIDEO segment retained on the GUARDIAN's node for review
  // (bulwark-video::SegmentStore). The parent app loads it from local storage; it
  // is NEVER raw bytes and NEVER carries suspected CSAM (always empty for
  // CSAM_SUSPECTED — the store refuses to persist it). Empty when no clip.
  string    local_segment_uri = 12;
}

message AlertAck {
  string alert_id  = 1;
  bool   delivered = 2; // accepted by the relay (queued for email)
  bool   deduped   = 3; // suppressed by rate-limit/digest
  string detail    = 4;
}

message AlertBatch {
  repeated AlertEvent events = 1;
}

message AlertAckBatch {
  repeated AlertAck acks = 1;
}

service AlertRelay {
  rpc RaiseAlert(AlertEvent) returns (AlertAck);
  rpc RaiseAlerts(AlertBatch) returns (AlertAckBatch); // digest / backfill
}

// ---------------------------------------------------------------------------
// Review service — guardian approve/deny (notification + Review screen →
// bulwark-policy / bulwark-alert). See docs/design/parent-notifications.md.
// APPROVE allowlists the host / content hash for this child; DENY confirms the
// block. Every decision is audited by bulwark-policy. RegisterPushTarget lets the
// cluster relay an alert to a guardian's separate device via a self-hosted
// UnifiedPush endpoint (FOSS; no Google/Apple);
// StreamPendingReviews carries the SAME redacted AlertEvent (no media, ever).
// ---------------------------------------------------------------------------

// The guardian's verdict on a flagged item.
enum ReviewDecision {
  REVIEW_DECISION_UNSPECIFIED = 0;
  APPROVE                     = 1; // allow this item (allowlist host/hash)
  DENY                        = 2; // confirm the block
}

// Breadth of an APPROVE (mirrors bulwark-policy's host/content-hash allowlist).
enum ReviewScope {
  REVIEW_SCOPE_UNSPECIFIED = 0;
  THIS_ITEM                = 1; // only the exact content (by evidence hash)
  THIS_HOST                = 2; // the whole app/host involved
}

// One guardian decision on a previously-raised AlertEvent.
message ReviewRequest {
  string         alert_id  = 1; // the AlertEvent.alert_id being decided
  ReviewDecision decision  = 2;
  string         device_id = 3; // supervised device the alert came from
  ReviewScope    scope     = 4; // breadth of an APPROVE (ignored for DENY)
  int64          ts        = 5;
}

message ReviewAck {
  string alert_id = 1;
  bool   applied  = 2;
}

// A guardian device registered for remote push via self-hosted UnifiedPush.
// Routing endpoint only — no alert content.
message PushTarget {
  string device_id    = 1; // the GUARDIAN device id
  string push_endpoint = 2; // UnifiedPush endpoint URL (self-hosted; was FCM token)
  string platform     = 3; // "android" | "ios" | "web"
}

message PushAck {
  bool ok = 1;
}

message DeviceFilter {
  string device_id = 1; // empty = all supervised devices
  // Guardian session token (from Accounts.Login). When set, the pending-review
  // stream is scoped to the children this guardian is assigned to — an alert is
  // delivered only if its child_id is one of theirs. May also be supplied via the
  // `authorization: Bearer <token>` gRPC metadata header. Empty = legacy
  // device-only behaviour (no per-guardian scoping).
  string token = 2;
}

// Guardian approve/deny review + remote-push registration. The pending-review
// stream re-emits the redacted AlertEvent (same no-media invariant as AlertRelay).
service Review {
  rpc SubmitDecision(ReviewRequest) returns (ReviewAck);
  rpc RegisterPushTarget(PushTarget) returns (PushAck);
  rpc StreamPendingReviews(DeviceFilter) returns (stream AlertEvent);
  // Fetch a retained blocked/borderline VIDEO clip for review, streamed in chunks,
  // so a guardian on a DIFFERENT device than the server can play it (not just a
  // co-located parent reading blob:// off local disk). CSAM is never retained, so
  // it can never be fetched here.
  rpc FetchSegment(SegmentRequest) returns (stream SegmentChunk);
}

// Request to fetch a retained video segment by its blob:// URI
// (AlertEvent.local_segment_uri). `token` authenticates the guardian in accounts
// mode (may also be supplied via the authorization Bearer metadata header).
message SegmentRequest {
  string local_segment_uri = 1;
  string token = 2;
}

// One server-streamed chunk of segment bytes.
message SegmentChunk {
  bytes data = 1;
}

// ---------------------------------------------------------------------------
// Tamper service — child-device protection liveness + uninstall/disable alerts.
// The supervised child app sends periodic Heartbeats carrying its
// ProtectionStatus. A self-detected downgrade (accessibility/VPN/device-admin
// turned off, or an app-removal attempt) OR a MISSED heartbeat (app killed or
// uninstalled — detected server-side) raises a guardian
// AlertEvent(kind = PROTECTION_DISABLED). This is the cross-platform safety net:
// even where removal can't be PREVENTED, it is DETECTED and reported.
// Transparent + consented (managed child device); carries NO content, ever.
// ---------------------------------------------------------------------------

// What protection degraded (drives the PROTECTION_DISABLED alert text). No raw
// content — these are status signals only.
enum TamperKind {
  TAMPER_KIND_UNSPECIFIED    = 0;
  APP_UNINSTALL_ATTEMPT      = 1; // child opened the app's uninstall / app-info flow
  DEVICE_ADMIN_REMOVED       = 2; // device-admin / Device-Owner DPC deactivated
  ACCESSIBILITY_DISABLED     = 3; // capture / uninstall-guard accessibility turned off
  VPN_DISABLED               = 4; // filtering VPN / proxy stopped or bypassed
  HEARTBEAT_MISSED           = 5; // server-side: no heartbeat within the grace window
  SAFE_MODE_OR_FACTORY_RESET = 6; // safe-mode boot or factory-reset signal
}

// Snapshot of which protections are currently active on the child device.
message ProtectionStatus {
  string device_id           = 1;
  string child_id            = 2; // optional; resolved cluster-side from device_id if empty
  bool   vpn_active          = 3; // filtering VPN / proxy is up
  bool   device_admin_active = 4; // device-admin / DPC active
  bool   accessibility_active = 5; // capture / uninstall-guard service enabled
  bool   always_on_lockdown  = 6; // always-on VPN lockdown engaged (fail-closed)
  string platform            = 7; // "android" | "windows" | "macos" | ...
  string app_version         = 8;
  int64  ts                  = 9; // unix epoch millis
}

// Child → cluster liveness + protection report.
message Heartbeat {
  ProtectionStatus status = 1;
  // Tamper events observed locally since the last heartbeat (empty on a normal
  // liveness ping). Each becomes a PROTECTION_DISABLED guardian alert.
  repeated TamperKind tamper_events = 2;
  // Per-device credential from PairResult.device_token. In accounts mode the
  // server verifies it, so a forged heartbeat can't keep a removed device
  // looking alive (which would suppress the missed-check-in protection-status
  // alert). Devices enrolled before tokens existed are accepted for now
  // (legacy grace, logged) until a device-removal/re-pair flow ships
  // (re-pairing an enrolled device_id currently returns DeviceInUse —
  // follow-up). Content-free: a random id.
  string device_token = 3;
}

message HeartbeatAck {
  uint32 next_interval_secs = 1; // server-tuned cadence (0 = keep current)
  bool   ok                 = 2;
}

service Tamper {
  // Periodic child liveness + protection status. A self-reported downgrade or a
  // missed heartbeat (detected server-side by the liveness sweeper) raises a
  // PROTECTION_DISABLED guardian alert via the same relay fan-out.
  rpc Heartbeat(Heartbeat) returns (HeartbeatAck);
}

// ---------------------------------------------------------------------------
// Accounts service — parent accounts + per-child assigned guardians.
//   * A PARENT ACCOUNT is an email + password (password is KDF-hashed at rest,
//     never stored plaintext — see bulwark-server::accounts).
//   * A CHILD belongs to a family; one or more guardian accounts are ASSIGNED to
//     each child. Alerts for a child route ONLY to that child's guardians
//     (AlertEvent.child_id → Review.StreamPendingReviews scoping by token).
//   * Mutating RPCs authenticate with the Session token from Login (also accepted
//     via `authorization: Bearer <token>` metadata).
// In-memory today (SEAM for durable storage); no raw content ever touches here.
// ---------------------------------------------------------------------------

message CreateAccountRequest {
  string email        = 1;
  string password     = 2; // hashed server-side (Argon2id PHC at rest); never stored
  string display_name = 3;
}

message AccountAck {
  string account_id = 1;
  bool   created    = 2; // false if the email already exists
  string detail     = 3;
  // ONE-TIME recovery code, returned ONLY on a successful CreateAccount (empty on a
  // duplicate-email no-op). The out-of-band secret the user saves: it lets them
  // self-reset their password via ResetPassword with NO operator/email loop. The
  // server stores only its Argon2id hash — this plaintext is shown exactly once and
  // never recoverable. Single-use: a successful reset invalidates it + issues a new one.
  string recovery_code = 4;
}

message LoginRequest {
  string email    = 1;
  string password = 2;
}

message Session {
  string token      = 1; // opaque bearer token for subsequent calls
  string account_id = 2;
  int64  issued_ts  = 3; // unix epoch millis
}

message AddChildRequest {
  string token      = 1; // caller's session; caller is auto-assigned as guardian
  string child_name = 2;
  string device_id  = 3; // the child's supervised device (links alerts → child)
}

// A supervised child + the guardian accounts assigned to them.
message Child {
  string child_id   = 1;
  string family_id  = 2;
  string child_name = 3;
  string device_id  = 4;
  repeated string guardian_account_ids = 5;
}

message AssignGuardianRequest {
  string token               = 1; // caller must already guard this child
  string child_id            = 2;
  string guardian_account_id = 3; // account to add as a guardian of the child
}

message GuardianAck {
  bool   ok     = 1;
  string detail = 2;
}

message ListChildrenRequest {
  string token = 1; // returns the children this guardian is assigned to
}

message Children {
  repeated Child children = 1;
}

// --- Pairing: parent generates a short code; the child device redeems it. ---
message CreatePairCodeRequest {
  string token      = 1; // parent session (also accepted via Bearer metadata)
  string child_name = 2;
}
message PairCode {
  string code       = 1; // short, human-typeable, single-use
  int64  expires_ts = 2; // unix epoch millis
}
message RedeemPairCodeRequest {
  string code      = 1;
  string device_id = 2; // the child device's stable id (links alerts → child)
}
message PairResult {
  string child_id  = 1;
  string family_id = 2;
  // Per-device credential minted at redeem and returned EXACTLY ONCE. The
  // child device stores it and presents it on Tamper.Heartbeat and the
  // ChildControl Get/StreamChildConfig reads, so knowing a device_id alone is
  // not enough to act as that device. The server keeps only a sha256 digest
  // (never the raw value); it cannot be re-fetched, and rotation needs the
  // device-removal/re-pair flow (follow-up — re-pairing an enrolled
  // device_id currently returns DeviceInUse).
  // Content-free: a random id, carries no content.
  string device_token = 3;
}

// --- Password lifecycle: authenticated change + self-service recovery reset. ---

// Authenticated rotation: the caller proves the OLD password, sets a new one.
// `token` is a live guardian session (also accepted via Bearer metadata). On
// success the server re-hashes with Argon2id and invalidates the account's OTHER
// sessions (the rotated-from device keeps its session). Passwords never logged.
message ChangePasswordRequest {
  string token        = 1; // caller's session (also via Bearer metadata)
  string old_password = 2; // verified before the change
  string new_password = 3; // stored Argon2id; >= 8 chars
}

// Self-service reset with NO operator/SSH/email loop: the user proves the
// out-of-band recovery code (from CreateAccount) and sets a new password. The
// used code is INVALIDATED and a fresh one returned in the ack. Reset attempts are
// rate-limited per email exactly like Login, so repeated wrong guesses are refused.
message ResetPasswordRequest {
  string email         = 1;
  // EITHER the one-time recovery code saved at account creation OR a short-lived
  // code emailed by RequestPasswordReset — the server tries both. On success the
  // used credential is consumed (the recovery code rotates; an emailed code expires).
  string recovery_code = 2;
  string new_password  = 3; // stored Argon2id; >= 8 chars
}

message ResetPasswordAck {
  bool   ok                = 1;
  string detail            = 2;
  // The FRESH recovery code that replaces the consumed one (shown once). Save it:
  // the previous code is now dead. Empty when ok == false.
  string new_recovery_code = 3;
}

// Request an EMAILED reset code — the alternative to the saved recovery code when
// SMTP is configured. The guardian who can't find their recovery code asks the
// server to email a short-lived reset code to their account address; they then
// complete the reset via ResetPassword (the emailed code goes in `recovery_code`).
// ANTI-ENUMERATION: the ack is ALWAYS the same generic ok=true, so this endpoint
// never reveals whether an email has an account — ordinary privacy hygiene for a
// family product. Repeated requests for the same email are rate-limited so an
// inbox can't be flooded.
message RequestPasswordResetRequest {
  string email = 1;
}

message RequestPasswordResetAck {
  bool   ok     = 1; // always true (generic) — never an account-existence oracle
  string detail = 2; // generic guidance, identical for known + unknown emails
}

service Accounts {
  rpc CreateAccount(CreateAccountRequest) returns (AccountAck);
  rpc Login(LoginRequest) returns (Session);
  rpc AddChild(AddChildRequest) returns (Child);
  rpc AssignGuardian(AssignGuardianRequest) returns (GuardianAck);
  rpc ListChildren(ListChildrenRequest) returns (Children);
  // Pairing: parent mints a code (CreatePairCode); the not-yet-enrolled child
  // redeems it (RedeemPairCode is unauthenticated — the code IS the credential;
  // wrong-code guesses are rate-limited server-side). A successful redeem also
  // mints the device_token the device authenticates with from then on.
  rpc CreatePairCode(CreatePairCodeRequest) returns (PairCode);
  rpc RedeemPairCode(RedeemPairCodeRequest) returns (PairResult);
  // Authenticated password change (proves the old password). Invalidates the
  // account's other sessions on success. Reuses AccountAck (recovery_code empty).
  rpc ChangePassword(ChangePasswordRequest) returns (AccountAck);
  // Self-service password reset via the one-time recovery code — no operator loop.
  // Throttled per email like Login; issues a fresh recovery code on success.
  // The `recovery_code` field ALSO accepts a short-lived code emailed by
  // RequestPasswordReset, so a guardian can reset with EITHER credential.
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordAck);
  // Email a short-lived reset code to the account address (when SMTP is
  // configured) — the fallback for a guardian who can't find their recovery code.
  // Always returns a generic ok (anti-enumeration); rate-limited per email.
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetAck);
}

// ---------------------------------------------------------------------------
// ChildControl service — parent-set, child-applied runtime config (the remote
// "VPN switch": region/server, filtering on/off, strictness). CONTENT-FREE:
// policy + routing only, never message/media. See docs/design/parent-controlled-vpn.md.
//   * A guardian SetChildConfig is authenticated by the session token and scoped
//     to a child they guard (same model as Review/Accounts).
//   * The child fetches/streams its own config by device identity: device_id
//     plus the per-device token minted at pairing (PairResult.device_token);
//     config_version is monotonic per child so a stale config can never roll back
//     protection.
// ---------------------------------------------------------------------------

// Strictness band; maps onto bulwark-policy AgeProfile + thresholds.
enum FilteringProfile {
  FILTERING_PROFILE_UNSPECIFIED = 0;
  YOUNG_CHILD                   = 1; // strictest
  PRETEEN                       = 2;
  TEEN                          = 3;
  CUSTOM                        = 4;
}

// Where the child's traffic is inspected/filtered.
enum FilterLocation {
  FILTER_ON_DEVICE = 0; // default: capture + inspect ON the device; traffic exits via the child's own IP
  FILTER_ON_SERVER = 1; // route through the chosen PH Bulwark Cloud region (WireGuard): the region NATs the
                        //   traffic out (the child's IP is anonymised) AND filters server-side
}

// Per-child desired runtime config, set by a guardian, applied by the child device.
message ChildConfig {
  string child_id          = 1;
  string device_id         = 2;
  bool   filtering_enabled = 3; // the parent's master VPN on/off switch
  string server_region     = 4; // "uk" | "us" | "self"
  string server_endpoint   = 5; // resolved cluster endpoint the child filters through
  FilteringProfile profile = 6; // strictness / age band -> bulwark-policy
  bool   require_always_on = 7; // request always-on VPN lockdown (needs Device Owner)
  uint64 config_version    = 8; // monotonic; the child applies only a strictly newer one
  int64  updated_ts        = 9; // unix epoch millis
  string updated_by        = 10; // guardian account id (audit)
  FilterLocation filter_location = 11; // on-device (default) vs route-through-cloud + filter server-side
}

message SetChildConfigRequest {
  string token       = 1; // guardian session (also via Bearer metadata); must guard child_id
  ChildConfig config = 2; // config_version/updated_ts/updated_by are set server-side
}

message ChildConfigAck {
  bool   applied        = 1;
  uint64 config_version = 2;
  string detail         = 3;
}

message ChildConfigFilter {
  string device_id    = 1; // child identifies by its device id / cert subject
  // Dual purpose: (a) stream filter — emit only configs strictly newer than
  // this; (b) the child's APPLIED-VERSION REPORT — the server records it per
  // enrolled device (last version applied + when it last checked in), which
  // GetChildStatus exposes to the guardian ("applied ✓ vN" vs "pending").
  // Content-free: a bare version number, never content.
  uint64 have_version = 2;
  // Per-device credential from PairResult.device_token — proves the caller IS
  // the enrolled device, so a config is only ever handed to its own device.
  // Devices enrolled before tokens existed are accepted (legacy grace, logged)
  // until a device-removal/re-pair flow ships (re-pairing an enrolled
  // device_id currently returns DeviceInUse — follow-up).
  string device_token = 3;
}

// Guardian-side status query: did the child apply the config yet? `token` must
// belong to a guardian of `child_id` (same scoping as SetChildConfig).
message ChildStatusRequest {
  string token    = 1; // guardian session (also via Bearer metadata)
  string child_id = 2;
}

// Desired-vs-applied status for the parent console. Child-reported state lives
// HERE — never on ChildConfig, which stays the guardian's desired document.
// Content-free: version numbers, a check-in timestamp, and the guardian's own
// desired ChildConfig (policy + routing only, like ChildConfig itself).
message ChildConfigStatus {
  string child_id        = 1;
  uint64 desired_version = 2; // latest guardian-set config_version
  uint64 applied_version = 3; // last version the child reported applied (0 = none yet)
  int64  last_report_ts  = 4; // unix ms of the child's last check-in (0 = never / since restart)
  // The guardian's current desired config document, echoed back so the parent
  // console can seed its controls from what was last set (instead of hardcoded
  // defaults a later Apply would silently revert unchanged fields to). No new
  // auth surface: GetChildStatus already requires a guardian session scoped to
  // this child — the same gate that WRITES this document via SetChildConfig.
  ChildConfig desired    = 5;
}

service ChildControl {
  // Guardian sets desired config (auth: guardian token, scoped to their child).
  rpc SetChildConfig(SetChildConfigRequest) returns (ChildConfigAck);
  // Child fetches its current desired config (one-shot, e.g. on app start).
  // `have_version` doubles as the child's applied-version report (recorded).
  rpc GetChildConfig(ChildConfigFilter) returns (ChildConfig);
  // Child streams desired config; server pushes on every guardian change.
  rpc StreamChildConfig(ChildConfigFilter) returns (stream ChildConfig);
  // Guardian reads desired-vs-applied + last check-in (auth: guardian token, scoped).
  rpc GetChildStatus(ChildStatusRequest) returns (ChildConfigStatus);
}

// ---------------------------------------------------------------------------
// WgProvision service — WireGuard peer provisioning for FILTER_ON_SERVER.
// The child device registers its WireGuard PUBLIC key (the private key NEVER
// leaves the device — same invariant as the per-install inspection CA) and
// learns its assigned tunnel address + the region's endpoint material.
//   * DEVICE-authenticated: device_id + the per-device token minted at pairing
//     (PairResult.device_token) — the same gate as ChildControl Get/Stream.
//   * Idempotent: re-registering the same device+key returns the SAME address;
//     a NEW key for the same device is a key rotation (address kept stable).
//   * DECOUPLED from wg(8): the server only persists the DESIRED peer set to
//     `<BULWARK_STATE_DIR>/wg_peers.json` (/var/lib/bulwark/wg_peers.json on a
//     region box); an on-box reconciler applies it with
//     deploy/wireguard/wg-peers.sh. A grant is a PROMISE of enrollment, live
//     after the next reconcile pass — not an already-open tunnel.
// Content-free: keys, addresses, endpoints only — never message/media.
// ---------------------------------------------------------------------------

message RegisterWgPeerRequest {
  string device_id     = 1; // the enrolled supervised device (same id as everywhere else)
  string device_token  = 2; // per-device credential from PairResult.device_token
  // The device's WireGuard PUBLIC key (44-char base64 of 32 bytes), generated
  // on-device (boringtun). NEVER the private key — the server validates shape
  // only (a public and private key are indistinguishable by shape, so keeping
  // the private key on-device is the CLIENT's enrollment invariant).
  string wg_public_key = 3;
}

message WgPeerGrant {
  // Assigned tunnel address, e.g. "10.8.0.7" — stable per device across
  // re-registers and key rotations. The client configures it as a /32.
  string assigned_address  = 1;
  string server_public_key = 2; // the region's WG public key (base64)
  string server_endpoint   = 3; // host:port, e.g. "vpn.predatorhunters.co.uk:51820"
  uint32 keepalive_secs    = 4; // PersistentKeepalive the client should set (25)
  // HONEST server-side-filtering flag: TRUE only when the bulwark-net engine is
  // actually inspecting the wg0 forward path on this region (phase 3 of
  // docs/design/server-vpn-mode-and-ca-trust.md §4). While FALSE the tunnel is
  // transport/NAT ONLY — a child whose guardian expects filtering must NOT be
  // routed through an unfiltered exit, so the client keeps filtering ON-DEVICE
  // (or declines the tunnel) when this is false. Never set aspirationally.
  bool   filter_active     = 5;
}

// Device-facing WireGuard provisioning (auth: the pairing-minted device token).
service WgProvision {
  // Register/refresh this device's WG peer enrollment and learn its grant.
  // Safe to call on every tunnel bring-up (idempotent; rotation-aware).
  rpc RegisterWgPeer(RegisterWgPeerRequest) returns (WgPeerGrant);
}

// ---------------------------------------------------------------------------
// ClusterControl service — membership / health / work queue (bulwark-cluster)
// ---------------------------------------------------------------------------

// Role a node plays. Single binary, role chosen by flag (PLAN §1).
enum NodeRole {
  NODE_ROLE_UNSPECIFIED = 0;
  LB                    = 1; // load balancer / gateway
  WORKER                = 2; // analysis worker
  ALL_IN_ONE            = 3; // home single-node deployment
}

enum NodeState {
  NODE_STATE_UNSPECIFIED = 0;
  ALIVE                  = 1;
  SUSPECT                = 2; // SWIM suspect
  DEAD                   = 3;
  DRAINING               = 4; // graceful shutdown, finishing in-flight work
}

message NodeInfo {
  string   node_id   = 1;
  NodeRole role        = 2;
  string   address     = 3; // host:port (mTLS endpoint)
  NodeState state       = 4;
  uint64    incarnation = 5; // SWIM incarnation number
  repeated ExecutionProvider exec_providers = 6; // worker capability
  string    version     = 7;
}

message JoinRequest {
  NodeInfo node  = 1;
  repeated string seed_nodes = 2; // known cluster members to gossip with
}

message JoinResponse {
  bool     accepted   = 1;
  repeated NodeInfo members = 2; // current view at join time
  string   cluster_id  = 3;
  string   reason       = 4; // populated when accepted == false
}

message LeaveRequest {
  string node_id = 1;
  bool   graceful = 2; // true → drain first
}

message LeaveResponse {
  bool accepted = 1;
}

message HealthRequest {
  string node_id = 1; // empty = whole-cluster health
}

// Health snapshot for a node (or aggregate). Feeds LB + offload backpressure.
message HealthStatus {
  string    node_id        = 1;
  NodeState state           = 2;
  uint32    queue_depth      = 3; // pending work items
  uint32    inflight         = 4; // currently processing
  float     cpu_load         = 5; // 0.0–1.0
  float     gpu_load         = 6; // 0.0–1.0, 0 if no GPU
  uint64    mem_used_mb       = 7;
  uint32    p50_latency_ms     = 8;
  uint32    p99_latency_ms     = 9;
  bool      accepting_work     = 10; // false when quorum/heartbeat lost
  int64     ts                  = 11;
}

// One queued work item (an AnalysisRequest plus routing metadata).
message WorkItem {
  string          work_id   = 1;
  AnalysisRequest request    = 2;
  uint32          priority    = 3; // higher = sooner (live stream > VOD)
  int64           enqueued_ts = 4;
  uint32          attempts    = 5; // redelivery count
}

message EnqueueRequest {
  WorkItem item = 1;
}

message EnqueueResponse {
  string work_id          = 1;
  uint32 queue_position   = 2;
  bool   accepted          = 3; // false under backpressure → caller runs local
}

message DequeueRequest {
  string node_id        = 1; // claiming worker
  uint32 max_items       = 2;
  repeated ExecutionProvider provides = 3; // capability filter
  uint32 wait_ms          = 4; // long-poll timeout
}

message DequeueResponse {
  repeated WorkItem items = 1;
}

message DrainRequest {
  string node_id        = 1;
  uint32 deadline_secs   = 2; // finish in-flight within this, then DEAD
}

message DrainResponse {
  bool   accepted      = 1;
  uint32 inflight      = 2; // remaining when accepted
}

message WatchHealthRequest {
  string node_id           = 1; // empty = all nodes
  uint32 interval_ms        = 2; // desired push cadence
}

// Cluster membership, health, and work distribution. Postgres is the quorum
// source-of-truth (avoids split-brain); SWIM gossip rides this transport.
service ClusterControl {
  rpc Join(JoinRequest) returns (JoinResponse);
  rpc Leave(LeaveRequest) returns (LeaveResponse);
  rpc Health(HealthRequest) returns (HealthStatus);
  rpc WatchHealth(WatchHealthRequest) returns (stream HealthStatus);
  rpc Enqueue(EnqueueRequest) returns (EnqueueResponse);
  rpc Dequeue(DequeueRequest) returns (DequeueResponse);
  rpc Drain(DrainRequest) returns (DrainResponse);
}

// ---------------------------------------------------------------------------
// StaffAdmin service — INTERNAL Predator Hunters operators console (NOT
// guardian-facing). Staff accounts live in a SEPARATE store + token namespace
// from guardian Accounts, so a guardian session can never authorize a staff
// RPC and vice versa. CONTENT-FREE BY SHAPE: ids, counts, versions,
// timestamps, and hashes only — never message/media text, alert payloads,
// child names, or per-peer identities. Every staff action is appended to a
// tamper-evident hash-chain audit log. See docs/design/staff-management-system.md.
// ---------------------------------------------------------------------------

// Staff RBAC role — exactly one per staff account.
enum StaffRole {
  STAFF_ROLE_UNSPECIFIED = 0;
  SUPPORT                = 1; // guardian-account support (metadata only, never content)
  SAFETY_OFFICER         = 2; // NCMEC escalation workflow (case ids + hashes only)
  OPERATOR               = 3; // fleet/region health + capacity
  ADMIN                  = 4; // everything, incl. CreateStaff + audit query
}

// Create a staff account. BOOTSTRAP-GATED: while ZERO staff accounts exist the
// caller presents the operator-set bootstrap code (BULWARK_STAFF_BOOTSTRAP_CODE,
// compared by sha256 digest) and the new account is forced to ADMIN; once any
// staff account exists, the bootstrap path is dead forever and `token` must be
// a live ADMIN staff session (also accepted via Bearer metadata).
message CreateStaffRequest {
  string    token          = 1; // ADMIN staff session (empty on bootstrap)
  string    bootstrap_code = 2; // one-time bootstrap credential (empty otherwise)
  string    email          = 3;
  string    password       = 4; // Argon2id PHC at rest; never stored plaintext
  string    display_name   = 5;
  StaffRole role           = 6; // ignored on bootstrap (forced ADMIN)
}

message StaffAck {
  string staff_id = 1;
  bool   created  = 2;
  string detail   = 3;
  // ONE-TIME TOTP enrollment material, returned ONLY on a successful create and
  // never recoverable through any RPC afterwards: the base32 shared secret plus
  // a ready-made otpauth:// URI for the authenticator app.
  string totp_secret_base32 = 4;
  string otpauth_uri        = 5;
}

// Staff sign-in: password AND a live TOTP code (mandatory 2FA). Throttled per
// email like guardian login; wrong email/password/code are indistinguishable.
message StaffLoginRequest {
  string email     = 1;
  string password  = 2;
  string totp_code = 3; // 6 digits, 30s step, +/-1 step skew; replay refused
}

message StaffSession {
  string    token     = 1; // opaque bearer; stored server-side as sha256 digest only
  string    staff_id  = 2;
  StaffRole role      = 3;
  int64     issued_ts = 4; // unix epoch millis; SHORT TTL (default 2h)
}

message RegionsRequest {
  string token = 1; // any staff role (read-only, content-free)
}

// Content-free region snapshot. Counts and gauges ONLY — never peer
// identities, device ids, child ids, or addresses of enrolled families.
message RegionInfo {
  string region                = 1; // "uk" | "us" | ...
  string endpoint              = 2; // the gRPC endpoint guardians connect to
  bool   probed                = 3; // false until live probing ships (increment 4)
  bool   healthy               = 4; // meaningful only when probed == true
  string deploy_version        = 5; // serving binary version
  int64  tls_cert_expiry_ts    = 6; // unix ms; 0 = unknown
  uint32 wg_peer_count         = 7; // COUNT only — never peer identities
  uint32 enrolled_device_count = 8; // COUNT only
  int64  ts                    = 9; // snapshot time, unix ms
}

message Regions {
  repeated RegionInfo regions = 1;
}

message FleetHealthRequest {
  string token  = 1;
  string region = 2; // required; unknown region -> NOT_FOUND
}

// Per-region health: the RegionInfo summary plus per-node ClusterControl
// HealthStatus snapshots (queue depth / latency / load — already content-free).
message FleetHealth {
  string region            = 1;
  RegionInfo info          = 2;
  repeated HealthStatus nodes = 3; // empty until increment 4 joins ClusterControl
}

// Query the tamper-evident staff audit chain. ADMIN only. The page reports
// `chain_ok` (the chain re-verified at read time), so silent tampering with
// the at-rest log is surfaced to the console on every query.
message StaffAuditQuery {
  string token     = 1;
  uint64 after_seq = 2; // return entries with seq >= this (cursor)
  uint32 limit     = 3; // 0 = server default (100), capped at 1000
}

// One audit entry. Content-free: actor + action + target ID + chain hash.
message StaffAuditEntry {
  uint64    seq        = 1;
  int64     ts         = 2; // unix ms
  string    staff_id   = 3; // actor ("bootstrap" for the first-account create)
  StaffRole role       = 4;
  string    action     = 5; // e.g. "staff.create", "staff.login", "fleet.list_regions"
  string    target     = 6; // content-free id (staff_id / region / case id)
  string    detail     = 7; // short content-free note
  string    entry_hash = 8; // sha256 hex: H(prev_hash || canonical(entry))
}

message StaffAuditPage {
  repeated StaffAuditEntry entries = 1;
  uint64 next_seq = 2; // pass back as after_seq for the next page
  bool   chain_ok = 3; // chain verified intact at read time
}

service StaffAdmin {
  // Bootstrap-gated staff onboarding (see CreateStaffRequest). TOTP enrollment
  // material is returned exactly once in the ack.
  rpc CreateStaff(CreateStaffRequest) returns (StaffAck);
  // Password + mandatory TOTP -> short-TTL staff session. Throttled per email.
  rpc StaffLogin(StaffLoginRequest) returns (StaffSession);
  // Content-free region list (any staff role). Audited like every staff action.
  rpc ListRegions(RegionsRequest) returns (Regions);
  // Content-free per-region health (any staff role). Audited.
  rpc GetFleetHealth(FleetHealthRequest) returns (FleetHealth);
  // Tamper-evident audit log query (ADMIN only). Audited (yes, querying the
  // audit log is itself an audited action).
  rpc QueryStaffAudit(StaffAuditQuery) returns (StaffAuditPage);
}

// ---------------------------------------------------------------------------
// FamilySafety service — child SOS + staff safety broadcasts.
//   * RaiseSos: the SUPERVISED CHILD's one-tap "I need help" action. Device-
//     authenticated (PairResult.device_token — the same gate as
//     Tamper.Heartbeat). The server resolves the child's name/family from the
//     enrolled device and fans an URGENT AlertEvent(kind = CHILD_SOS,
//     severity = CRITICAL) out to the child's guardians through the same relay
//     as every other alert (plus the email/push sink when configured).
//     CONTENT-FREE: who + when + which device — never location, messages, or
//     media. (A consent-gated coarse-location attachment is a LATER increment;
//     nothing here collects location.)
//   * SendSafetyBroadcast: a PH-STAFF-ORIGINATED region-wide family safety
//     notice ("amber-alert-like") fanned out to guardian consoles. HARD RULE:
//     never crowd-sourced and never a public accusation — staff issue notices,
//     guardians read them. AUTH PLACEHOLDER: gated by a server-side shared
//     staff token (BULWARK_STAFF_BROADCAST_TOKEN; unset = the rpc is off)
//     until the per-staff accounts/roles system ships (separate design in
//     progress). TODO(staff-system): the placeholder `staff_token` migrates to
//     a real per-staff credential via NEW fields/metadata — never renumbering.
//   * ListSafetyBroadcasts: active notices for late-joining guardian consoles
//     (the live stream only reaches connected ones) and, later, child devices
//     (the non-dismissable-until-acknowledged child notice is a follow-up
//     increment; `notify_child_devices` ships now so the shape is stable).
// ---------------------------------------------------------------------------

// Child SOS. Carries ONLY the device identity + tap time — no content, no location.
message SosRequest {
  string device_id    = 1; // the enrolled child device raising the SOS
  string device_token = 2; // per-device credential from PairResult.device_token
  int64  ts           = 3; // child-side tap time, unix epoch millis (the alert is server-stamped)
  // Client-generated idempotency key so a retried tap can't double-alert
  // (becomes the CHILD_SOS AlertEvent.alert_id). Empty = server derives one.
  string client_sos_id = 4;
}

message SosAck {
  // True when at least one guardian path took the alert (a live console
  // stream, or the configured email/push sink) — drives the child-facing
  // honesty: "your guardian has been alerted" vs "call a trusted adult".
  bool   delivered = 1;
  string alert_id  = 2; // the CHILD_SOS AlertEvent's id (dedupe/audit)
  uint32 guardian_streams_reached = 3;
  string detail    = 4;
}

// One staff-issued safety notice. broadcast_id/issued_ts/issued_by are
// SERVER-stamped. Content is staff-written plain text ONLY — no media and no
// third-party reports (broadcasts are staff-originated by hard rule).
message SafetyBroadcast {
  string   broadcast_id = 1; // server-assigned
  string   title        = 2; // short headline (<= 120 chars)
  string   body         = 3; // plain-text notice (<= 2000 chars)
  Severity severity     = 4; // defaults to HIGH when unspecified
  string   region       = 5; // "uk" | "us" | ...; empty = every region this node serves
  int64    issued_ts    = 6; // server-stamped, unix epoch millis
  int64    expires_ts   = 7; // 0 = active until superseded
  // Also surface on enrolled child devices as a notice that stays until
  // acknowledged. The child-device display + acknowledge flow is a follow-up
  // increment; the flag ships now so the message shape is stable.
  bool     notify_child_devices = 8;
  // Staff identity stamp. PLACEHOLDER value ("staff-shared-token") until the
  // staff accounts system lands, then a real staff account id — same field.
  string   issued_by    = 9;
}

message SendSafetyBroadcastRequest {
  // PLACEHOLDER staff credential: the server-side shared token
  // (BULWARK_STAFF_BROADCAST_TOKEN). TODO(staff-system): replaced by the
  // per-staff session credential from the staff-management design — added as
  // a NEW field / metadata header, never by renumbering this one.
  string staff_token = 1;
  SafetyBroadcast broadcast = 2; // broadcast_id/issued_ts/issued_by are server-stamped
}

message SafetyBroadcastAck {
  bool   accepted     = 1;
  string broadcast_id = 2;
  uint32 guardian_streams_reached = 3; // live consoles reached now; others poll List
  string detail       = 4;
}

// Active-notice fetch. Authenticated EITHER as a guardian (session token /
// Bearer metadata) OR as an enrolled child device (device_id + device_token).
message ListSafetyBroadcastsRequest {
  string token        = 1; // guardian session (also via Bearer metadata)
  string device_id    = 2; // child-device path
  string device_token = 3;
  string region       = 4; // optional filter; empty = all
}

message SafetyBroadcasts {
  repeated SafetyBroadcast broadcasts = 1; // active (unexpired), newest first
}

service FamilySafety {
  // Child SOS -> URGENT guardian alert (device-token authenticated).
  rpc RaiseSos(SosRequest) returns (SosAck);
  // Staff-originated regional safety notice (placeholder staff-token gate).
  rpc SendSafetyBroadcast(SendSafetyBroadcastRequest) returns (SafetyBroadcastAck);
  // Active notices for (re)connecting guardian consoles / child devices.
  rpc ListSafetyBroadcasts(ListSafetyBroadcastsRequest) returns (SafetyBroadcasts);
}
