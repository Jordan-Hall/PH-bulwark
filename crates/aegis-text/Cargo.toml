[package]
name = "aegis-text"
version.workspace = true
edition.workspace = true
license.workspace = true

# aegis-text — the deterministic grooming RULE + LEXICON engine (PRIMARY detector)
# plus adult-text detection, exposed through the `Analyzer` trait.
#
# MINIMAL-AI MANDATE: the rule engine below is the real detector and is always in
# the hot path. The optional `classifier` feature wires a tiny ONNX text model
# (DistilBERT/MiniLM, INT8) ONLY as a backstop that sets `classifier_backed` when
# it agrees — it is OFF by default and never gates a verdict. There is no LLM.
[features]
default = []
# Optional small text classifier backstop (ort/ONNX). OFF by default; never hot-path.
classifier = ["dep:ort"]

[dependencies]
aegis-proto = { path = "../aegis-proto" }

serde.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true

# Deterministic matching engine (reported as new explicit deps):
#   aho-corasick — efficient simultaneous multi-phrase scanning of the lexicon
#   regex        — patterned triggers ("you're sexy for 13", age probes, etc.)
aho-corasick = "1"
regex = "1"

# Embedded lexicon is parsed from TOML at startup (compiled into the binary via
# include_str!), keyed by category + language.
toml = "0.8"

# The `Analyzer` trait returns `futures_core::stream::BoxStream` from
# `analyze_stream`. `futures-core` is not yet a workspace dependency (see
# docs/design/interfaces.md "Notes for builders"); added explicitly here and
# flagged to C0/A1 to promote to the workspace once finalized.
futures-core = "0.3"
futures-util = "0.3"

# Optional classifier backstop only — see the `classifier` feature.
ort = { workspace = true, optional = true }

[dev-dependencies]
# tokio for the async `analyze_stream` test; serde_json for thread-state codec
# round-trip tests. `futures-util` / `futures-core` are already normal deps.
tokio = { workspace = true }
serde_json = { workspace = true }
