[package]
name = "aegis-vision"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aegis-proto = { path = "../aegis-proto" }
aegis-core = { path = "../aegis-core" }
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
ring.workspace = true # sha256 for evidence hashing

# Image decode + resize for preprocessing. Used by the always-compiled
# `preprocess` module (so its unit test runs with no model/ort), and by the
# `onnx` scorer to build the model input tensor. Default features cover the
# common decoders (JPEG/PNG/GIF/WebP/BMP) we expect on intercepted media.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }

# Small dedicated NSFW classifier (NudeNet/Falconsai ONNX) — runs only with the
# `onnx` feature; the default build is a deterministic stub (fails OPEN) so the
# crate links and tests run without a model artifact or the ONNX Runtime native
# library present. `ort` is OPTIONAL and gated so Smart App Control hosts that
# cannot load onnxruntime.dll still get a green default build.
ort = { workspace = true, optional = true }

# On LINUX, statically linking onnxruntime drags undefined abseil symbols into the
# final link (ort_sys) — fails in the slim Docker builder. Use `load-dynamic` there
# so ort dlopens the downloaded .so at runtime instead (the server image sets
# ORT_DYLIB_PATH). Windows/macOS keep the direct download-binaries link — using
# load-dynamic there risks the OS loader grabbing an ABI-mismatched system
# onnxruntime.dll and hanging (see the workspace Cargo.toml note). Cargo unifies ort
# features across the build graph, so this also covers the aegis-server onnx build.
[target.'cfg(target_os = "linux")'.dependencies]
ort = { workspace = true, optional = true, features = ["load-dynamic"] }

[features]
default = []
onnx = ["dep:ort"]
