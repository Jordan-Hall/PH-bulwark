  "it's no big deal",
  "its no big deal",
  "it's not a big deal",
  "no big deal",
  "prove you like me",
  "prove that you like me",
  "prove you trust me",
  "everyone does it",
  "all the other girls do it",
  "all the other guys do it",
  "don't be shy",
  "dont be shy",
  "don't be scared",
  "you won't get in trouble",
  "you wont get in trouble",
  "nothing bad will happen",
  "i won't tell anyone",
  "stop being so uptight",
