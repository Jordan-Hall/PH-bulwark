name: deploy

# Build the PH Bulwark server image in CI (where there's RAM for the ORT/release
# build), push it to GHCR, then have the EC2 instance docker-PULL + run it via AWS
# SSM. The instance NEVER builds — so the small (t3.small / 2 GB) box can't OOM on
# the heavy onnx build; it only runs the prebuilt image (~0.5 GB at runtime).
#
# Gated on the GitHub Environment `production`. Required secrets/vars:
#   secret AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  scoped deploy IAM user
#                                                     (ph-bulwark-deployer; ssm:SendCommand)
#   var    AWS_REGION        e.g. eu-west-2
#   var    AWS_INSTANCE_ID   the EC2 instance id (SSM-managed)
#   var    BULWARK_PORT        optional, default 8443
# The instance needs SSM (AmazonSSMManagedInstanceCore) + outbound HTTPS to ghcr.io.

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch: {}

concurrency:
  group: deploy-server
  cancel-in-progress: true

env:
  # GHCR image, lowercase (GHCR requires it). Built with FEATURES=onnx so it carries
  # real image scoring + the bundled NSFW model; the instance just runs it.
  IMAGE: ghcr.io/jordan-hall/bulwark-server

jobs:
  build-image:
    name: build + push onnx server image (CI has the RAM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (FEATURES=onnx, embeds the bundled NSFW model)
        run: |
          set -euo pipefail
          docker build --build-arg FEATURES=onnx,whisper,ffmpeg -f deploy/docker/Dockerfile \
            -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" .
      - name: Smoke test — server boots + loads the ONNX model (.so dlopens)
        run: |
          set -euo pipefail
          # Boot with the SAME flags production runs (accounts + persistent state
          # dir), so a guardian-state/ChildControl persistence regression fails
          # HERE instead of on the box.
          # BULWARK_ALLOW_PLAINTEXT=1: the smoke container never leaves the runner
          # loopback; production runs with BULWARK_TLS_CERT/KEY (see the SSM step).
          docker run -d --name smoke -e BULWARK_ACCOUNTS=1 -e BULWARK_ALLOW_PLAINTEXT=1 -e BULWARK_STATE_DIR=/var/lib/bulwark "$IMAGE:${GITHUB_SHA}" --role all-in-one
          sleep 12
          if [ "$(docker inspect -f '{{.State.Running}}' smoke 2>/dev/null)" != "true" ]; then
            echo "::error::server did not stay up — ONNX runtime .so missing or model load failed"
            docker logs smoke || true; docker rm -f smoke || true; exit 1
          fi
          echo "server is up; recent logs:"; docker logs smoke 2>&1 | tail -15
          docker rm -f smoke
      - name: Push to GHCR (only a booting image is published)
        run: |
          set -euo pipefail
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

  deploy-server:
    name: redeploy server via SSM (pull, no build, no SSH)
    needs: build-image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Configure AWS credentials (scoped deploy user)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Redeploy via SSM Run Command (docker pull the prebuilt image)
        env:
          IID: ${{ vars.AWS_INSTANCE_ID }}
          BULWARK_PORT: ${{ vars.BULWARK_PORT }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Outbound guardian email (password reset + alerts). OPTIONAL: when
          # BULWARK_SMTP_HOST is unset the deploy is byte-for-byte unchanged and
          # the recovery-code reset path still works without email. The password
          # is a GitHub SECRET (masked in logs); these reach the container via a
          # root-only --env-file on the box, never `docker run -e` (so they don't
          # show in `docker ps`/process args) and are never echoed here.
          SMTP_HOST: ${{ vars.BULWARK_SMTP_HOST }}
          SMTP_PORT: ${{ vars.BULWARK_SMTP_PORT }}
          SMTP_TLS: ${{ vars.BULWARK_SMTP_TLS }}
          SMTP_USERNAME: ${{ secrets.BULWARK_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.BULWARK_SMTP_PASSWORD }}
          ALERT_FROM: ${{ vars.BULWARK_ALERT_FROM }}
          RESET_FROM: ${{ vars.BULWARK_RESET_FROM }}
          RESET_TTL: ${{ vars.BULWARK_RESET_TOKEN_TTL_SECS }}
        run: |
          set -euo pipefail
          PORT="${BULWARK_PORT:-8443}"
          REF="${IMAGE}:${GITHUB_SHA}"

          # Build the SMTP env-file as a base64 blob (single token: JSON-safe,
          # no shell-special chars) and NEVER echo it, so it stays out of the
          # Actions log. Empty when SMTP isn't configured → the box clears any
          # stale file and the docker run gets no --env-file flag.
          SMTP_B64=""
          ENVFILE_FLAG=""
          if [ -n "${SMTP_HOST:-}" ]; then
            {
              echo "BULWARK_SMTP_HOST=${SMTP_HOST}"
              [ -n "${SMTP_PORT:-}" ]     && echo "BULWARK_SMTP_PORT=${SMTP_PORT}"
              [ -n "${SMTP_TLS:-}" ]      && echo "BULWARK_SMTP_TLS=${SMTP_TLS}"
              [ -n "${SMTP_USERNAME:-}" ] && echo "BULWARK_SMTP_USERNAME=${SMTP_USERNAME}"
              [ -n "${SMTP_PASSWORD:-}" ] && echo "BULWARK_SMTP_PASSWORD=${SMTP_PASSWORD}"
              [ -n "${ALERT_FROM:-}" ]    && echo "BULWARK_ALERT_FROM=${ALERT_FROM}"
              [ -n "${RESET_FROM:-}" ]    && echo "BULWARK_RESET_FROM=${RESET_FROM}"
              [ -n "${RESET_TTL:-}" ]     && echo "BULWARK_RESET_TOKEN_TTL_SECS=${RESET_TTL}"
            } > smtp.env
            SMTP_B64="$(base64 -w0 smtp.env)"
            rm -f smtp.env
            ENVFILE_FLAG="--env-file /var/lib/bulwark/smtp.env"
          fi
          # `set -eu` (NOT -eux) on the instance so the GHCR token isn't echoed into
          # the SSM command log. The login cred is removed again with `docker logout`.
          cat > params.json <<JSON
          {"commands":[
            "set -eu",
            "df -h / || true",
            "docker system prune -af || true",
            "docker rm -f aegis-server || true",
            "mkdir -p /var/lib/bulwark/tls && chmod 700 /var/lib/bulwark /var/lib/bulwark/tls",
            "[ -d /var/lib/aegis ] && cp -an /var/lib/aegis/. /var/lib/bulwark/ 2>/dev/null || true",
            "if [ ! -s /var/lib/bulwark/tls/server.crt ]; then TOK=\$(curl -s -X PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 300'); PUB_HOST=\$(curl -s -H \"X-aws-ec2-metadata-token: \$TOK\" http://169.254.169.254/latest/meta-data/public-hostname); PUB_IP=\$(curl -s -H \"X-aws-ec2-metadata-token: \$TOK\" http://169.254.169.254/latest/meta-data/public-ipv4); PUB_HOST=\${PUB_HOST:-\$PUB_IP}; openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -keyout /var/lib/bulwark/tls/ca.key -out /var/lib/bulwark/tls/ca.crt -subj '/CN=PH Bulwark Cluster CA' -days 3650; openssl req -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -keyout /var/lib/bulwark/tls/server.key -out /var/lib/bulwark/tls/server.csr -subj \"/CN=\$PUB_HOST\" -addext \"subjectAltName=DNS:\$PUB_HOST,IP:\$PUB_IP\"; openssl x509 -req -in /var/lib/bulwark/tls/server.csr -CA /var/lib/bulwark/tls/ca.crt -CAkey /var/lib/bulwark/tls/ca.key -CAcreateserial -days 825 -copy_extensions copyall -out /var/lib/bulwark/tls/server.crt; rm -f /var/lib/bulwark/tls/server.csr; chmod 600 /var/lib/bulwark/tls/ca.key /var/lib/bulwark/tls/server.key; fi",
            "chmod 600 /var/lib/bulwark/*.json 2>/dev/null || true",
            "chown -R 10001:10001 /var/lib/bulwark && chown root:root /var/lib/bulwark/tls/ca.key",
            "if [ -n '${SMTP_B64}' ]; then printf '%s' '${SMTP_B64}' | base64 -d > /var/lib/bulwark/smtp.env && chmod 600 /var/lib/bulwark/smtp.env && chown 10001:10001 /var/lib/bulwark/smtp.env; else rm -f /var/lib/bulwark/smtp.env; fi",
            "echo '${GHCR_TOKEN}' | docker login ghcr.io -u '${GHCR_USER}' --password-stdin",
            "docker pull '${REF}'",
            "docker rm -f bulwark-server || true",
            "docker run -d --name bulwark-server --restart unless-stopped -p ${PORT}:${PORT} -v /var/lib/bulwark:/var/lib/bulwark ${ENVFILE_FLAG} -e BULWARK_BIND=0.0.0.0:${PORT} -e BULWARK_ACCOUNTS=1 -e BULWARK_STATE_DIR=/var/lib/bulwark -e BULWARK_TLS_CERT=/var/lib/bulwark/tls/server.crt -e BULWARK_TLS_KEY=/var/lib/bulwark/tls/server.key '${REF}' --role all-in-one",
            "sleep 5",
            "docker ps --filter name=bulwark-server --format '{{.Status}}' | grep -q Up || { docker logs --tail 50 bulwark-server; exit 1; }",
            "docker logout ghcr.io || true",
            "docker image prune -f || true"
          ]}
          JSON
          CID=$(aws ssm send-command --instance-ids "$IID" \
            --document-name AWS-RunShellScript --comment "PH Bulwark redeploy (pull)" \
            --parameters file://params.json --query Command.CommandId --output text)
          echo "SSM command: $CID"
          for i in $(seq 1 60); do
            ST=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $ST"
            case "$ST" in
              Success) break;;
              Failed|Cancelled|TimedOut)
                echo "::error::SSM redeploy $ST"
                aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardErrorContent --output text
                exit 1;;
            esac
            sleep 10
          done
          echo "=== server output ==="
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardOutputContent --output text
