[package]
name = "aegis-store"
version.workspace = true
edition.workspace = true
license.workspace = true

# aegis-store — the `Store` trait (interfaces.md) with two backends:
#   * client/local: encrypted SQLite via SQLCipher (rusqlite `bundled-sqlcipher`)
#   * server/cluster: Postgres via `sqlx`
#
# DATA-HANDLING MANDATE (docs/security/data-handling.md):
#   This crate persists C1/C3 data ONLY — verdict + reason codes + hashes +
#   safe-thumbnail *references* + metadata. It NEVER persists C0 (message text,
#   explicit media bytes, raw decrypted bodies). The schema is shaped to make
#   that invariant structural: there is no column able to hold message text or
#   media bytes, and a unit test asserts it. Encryption-at-rest + retention
#   auto-purge + a tamper-evident hash-chained audit log are required here.
#
# NO AI/ML in this crate. NO telemetry.

[features]
# By default both backends compile. A pure client build can drop the Postgres
# adapter (and its sqlx dependency) with `--no-default-features --features sqlite`;
# a pure server build can do the reverse with `--features postgres`.
default = ["sqlite", "postgres"]
# Client/local SQLite backend. Plain `bundled` SQLite by default: portable,
# compiles without OpenSSL. The store persists ONLY metadata/hashes (never
# content, by schema invariant), so at-rest = OS disk encryption + age exports.
sqlite = ["dep:rusqlite"]
# Server/cluster shared-state Postgres backend.
postgres = ["dep:sqlx"]
# OPT-IN: SQLCipher page-level at-rest encryption. Also switch the rusqlite
# `bundled` feature to `bundled-sqlcipher` below; needs a SQLCipher build
# (system OpenSSL). Gates the `PRAGMA key` in sqlite.rs::init_conn.
sqlcipher = []

[dependencies]
aegis-proto = { path = "../aegis-proto" }
aegis-core = { path = "../aegis-core" }

serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true

# At-rest encryption. SQLCipher (below) encrypts the SQLite page store; `ring`
# additionally provides the SHA-256 used by the tamper-evident audit hash-chain
# and content hashing, and `age` is used for encrypted *exports/backups*
# (data-handling.md §3 "Persist": exports are age-encrypted, keys owner-held).
ring.workspace = true
age.workspace = true

# Client/local backend: SQLite with SQLCipher page-level encryption-at-rest.
# `bundled-sqlcipher` statically links SQLCipher so no system crypto lib is
# needed and the at-rest key is set via `PRAGMA key` (see crypto.rs).
# Plain bundled SQLite (no OpenSSL, builds everywhere). Pinned below the
# libsqlite3-sys 0.38 `cfg_select` break. For SQLCipher, build with --features
# sqlcipher and change "bundled" -> "bundled-sqlcipher".
rusqlite = { version = "0.32", features = ["bundled", "blob"], optional = true }

# Server/cluster backend: Postgres shared state. at-rest encryption is provided
# by the database/volume (data-handling.md §3); access is restricted by mTLS.
sqlx = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
