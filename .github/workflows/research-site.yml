name: research-site

# Build the Predator Hunters Research static site image in CI, push to GHCR,
# then have the EC2 box docker-PULL + run it via AWS SSM (same no-SSH pattern as
# deploy.yml). The box only RUNS the prebuilt image.
#
# Serves research.predatorhunters.co.uk via Caddy. Caddy auto-provisions a real
# Let's Encrypt cert over the Cloudflare DNS-01 challenge (CF_API_TOKEN), so the
# origin is valid under Cloudflare "Full (strict)". Cert state persists in a
# /data host volume.
#
# Gated on the GitHub Environment `production`. Reuses deploy.yml's secrets/vars:
#   secret AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  (ph-bulwark-deployer; ssm:SendCommand)
#   secret BULWARK_CF_DNS_TOKEN  Cloudflare DNS-edit token (also used by the server's acme.sh)
#   var    AWS_REGION         e.g. eu-west-2
#   var    AWS_INSTANCE_ID    the EC2 instance id (SSM-managed)
#
# ONE-TIME prerequisites (outside CI — see deploy/research/README.md):
#   * Cloudflare: proxied A record `research` → box IP  ✅ DONE.
#   * Security group: allow inbound :443 (and :80 for the redirect) from the
#     Cloudflare IP ranges. ⚠️ The deploy IAM is ssm:SendCommand-only and cannot
#     edit the SG — do this via the console or deploy/aws terraform.

on:
  push:
    branches: [master]
    paths:
      - apps/research/**
      - deploy/research/**
      - branding/**
      - .github/workflows/research-site.yml
  workflow_dispatch: {}

concurrency:
  group: deploy-research
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/jordan-hall/research-site

jobs:
  build-image:
    name: build + push research-site image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the wasm bundle into a Caddy image
        run: |
          set -euo pipefail
          docker build -f deploy/research/Dockerfile \
            -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" .
      - name: Smoke test — image runs + bundle is present
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE:${GITHUB_SHA}" caddy version
          docker run --rm --entrypoint sh "$IMAGE:${GITHUB_SHA}" -c 'test -f /srv/index.html && echo bundle-ok'
      - name: Push to GHCR
        run: |
          set -euo pipefail
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

  deploy:
    name: redeploy research-site via SSM (pull, no build, no SSH)
    needs: build-image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Configure AWS credentials (scoped deploy user)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Redeploy via SSM Run Command
        env:
          IID: ${{ vars.AWS_INSTANCE_ID }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cloudflare DNS-edit token for Caddy's DNS-01 issuance. Required — an
          # empty token means Caddy can't get a cert and the site won't serve TLS.
          CF_TOKEN: ${{ secrets.BULWARK_CF_DNS_TOKEN }}
        run: |
          set -euo pipefail
          REF="${IMAGE}:${GITHUB_SHA}"
          if [ -z "${CF_TOKEN}" ]; then
            echo "::error::secret BULWARK_CF_DNS_TOKEN is empty — Caddy needs it for DNS-01"; exit 1
          fi
          # Ship the token as a base64 env-file blob (single JSON/shell-safe token,
          # never echoed) → written 0600 on the box, passed via --env-file (not
          # `-e`, so it isn't visible in `docker inspect`/ps args).
          CF_B64="$(printf 'CF_API_TOKEN=%s\n' "${CF_TOKEN}" | base64 -w0)"
          # `set -eu` (NOT -eux) on the box so neither token is echoed.
          cat > params.json <<JSON
          {"commands":[
            "set -eu",
            "echo '${GHCR_TOKEN}' | docker login ghcr.io -u '${GHCR_USER}' --password-stdin",
            "docker pull '${REF}'",
            "mkdir -p /var/lib/research-caddy && chmod 700 /var/lib/research-caddy",
            "printf '%s' '${CF_B64}' | base64 -d > /etc/research-cf.env && chmod 600 /etc/research-cf.env",
            "docker rm -f research-site || true",
            "docker run -d --name research-site --restart unless-stopped -p 80:80 -p 443:443 --env-file /etc/research-cf.env -v /var/lib/research-caddy:/data '${REF}'",
            "sleep 8",
            "docker ps --filter name=research-site --format '{{.Status}}' | grep -q Up || { docker logs --tail 80 research-site; exit 1; }",
            "docker logout ghcr.io || true",
            "docker image prune -f || true"
          ]}
          JSON
          CID=$(aws ssm send-command --instance-ids "$IID" \
            --document-name AWS-RunShellScript --comment "research-site redeploy (pull)" \
            --parameters file://params.json --query Command.CommandId --output text)
          echo "SSM command: $CID"
          for i in $(seq 1 36); do
            ST=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $ST"
            case "$ST" in
              Success) break;;
              Failed|Cancelled|TimedOut)
                echo "::error::SSM redeploy $ST"
                aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardErrorContent --output text
                exit 1;;
            esac
            sleep 10
          done
          [ "$ST" = "Success" ] || { echo "::error::SSM redeploy timed out (last: $ST)"; exit 1; }
          echo "=== output ==="
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardOutputContent --output text
