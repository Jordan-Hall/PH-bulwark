name: android-release

# Build the SIGNED child + camera release APKs and attach them to the GitHub
# Release, so the self-hosted FOSS distribution channels can pull them:
#   * Obtainium points straight at these Release assets (auto-updates by tag);
#   * the self-hosted F-Droid repo (fdroid/) mirrors the same APKs;
#   * Accrescent takes the signed child APK for its own submission/signing.
# See docs/distribution.md for the full channel map.
#
# Two shipping APKs come out of one Gradle project:
#   :app     -> co.predatorhunters.bulwark         (child VpnService filter)  -> app-release.apk
#   :camera  -> co.predatorhunters.bulwark.camera  (local-only safe camera)  -> camera-release.apk
# The Manager (apps/parent, Dioxus) is a SEPARATE artifact and out of scope here.
#
# Signing is gated on the ANDROID_* secrets being present — EXACTLY like
# platform/android/{app,camera}/build.gradle.kts self-gate their signingConfig.
# When the secrets are absent the job still succeeds and ships UNSIGNED APKs
# plus a ::notice:: (so a release never silently fails for want of a keystore).
#
# Env/NDK/cargo-ndk setup mirrors android-emulator.yml; the release-asset upload
# mirrors release.yml (tag/Release -> action-gh-release; manual -> artifact).

on:
  release:
    types: [published]
  workflow_dispatch: {}

# Required so action-gh-release can attach assets to the Release; without it the
# upload silently 403s (the emulator workflow we mirror has no upload, hence no
# permissions block — release.yml does, and we copy it).
permissions:
  contents: write

# Same transient-crates.io-download hardening as android.yml / release.yml.
env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  release-apks:
    name: signed child + camera release APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4

      - name: Install NDK + export its path
        run: |
          sdkmanager "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
          # setup-android sets ANDROID_SDK_ROOT but NOT ANDROID_NDK_ROOT, so
          # cargo-ndk would see an empty NDK path. Pin the concrete NDK dir for
          # all subsequent steps (same as android-emulator.yml).
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Set up Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          # Three targets installed to mirror the emulator setup; the release
          # build only emits the two ARM ABIs (no x86_64 in a phone APK).
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platform/android/rust/bulwark-android/target
          key: ${{ runner.os }}-cargo-ndk-${{ hashFiles('platform/android/rust/bulwark-android/Cargo.lock') }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build child JNI lib (arm64-v8a + armeabi-v7a) into jniLibs
        # Only :app loads libbulwark_client.so; :camera ships no jniLibs of its
        # own (the ONNX Runtime AAR carries its per-ABI natives).
        working-directory: platform/android/rust/bulwark-android
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -o ../../app/src/main/jniLibs \
            build --release

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Signing-secret presence notice
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::notice title=Unsigned release APKs::No ANDROID_KEYSTORE_BASE64 secret — building UNSIGNED release APKs. Add the four ANDROID_* secrets to ship signed FOSS-store APKs (docs/distribution.md)."
          else
            echo "::notice title=Signed release APKs::Release keystore present — building SIGNED release APKs."
          fi

      - name: Assemble release APKs (:app + :camera)
        working-directory: platform/android
        # setup-gradle provides `gradle` (every workflow here uses it, matching
        # platform/android/README.md). The build.gradle signingConfig self-gates
        # on ANDROID_KEYSTORE_BASE64 being non-blank, so passing the secrets as
        # env here is enough — absent secrets => unsigned, present => signed.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :camera:assembleRelease --no-daemon --stacktrace

      - name: Stage APKs under stable asset names
        working-directory: platform/android
        # With signing the outputs are app-release.apk / camera-release.apk;
        # WITHOUT signing (minify off) Gradle emits *-release-unsigned.apk. Pick
        # whichever exists per module and rename to a STABLE asset name — these
        # exact names are referenced by the Obtainium config in
        # docs/distribution.md, so do not change them without updating that doc.
        run: |
          mkdir -p dist
          cp "$(find app/build/outputs/apk/release -name '*.apk' | head -n1)" dist/app-release.apk
          cp "$(find camera/build/outputs/apk/release -name '*.apk' | head -n1)" dist/camera-release.apk
          (cd dist && sha256sum app-release.apk camera-release.apk > SHA256SUMS-android-foss)
          ls -la dist/

      - name: Attach to the GitHub Release (published release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: platform/android/dist/*

      - name: Upload as a workflow artifact (manual dispatch)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v6
        with:
          name: ph-bulwark-foss-release-apks
          path: platform/android/dist/*
          if-no-files-found: error
