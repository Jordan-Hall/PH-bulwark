# Bulwark grooming + adult-text lexicon — English (en)
#
# Structure (multilingual-ready): one file per BCP-47 language. Each grooming
# category lists literal trigger PHRASES (matched case-insensitively by
# aho-corasick) and optional regex PATTERNS (matched by `regex`) for templated
# triggers such as age-conditioned compliments. Weights/multipliers/thresholds
# live in code (model-research.md §grooming) — this file is data only, so
# translators add a new <lang>.toml without touching the engine.
#
# PRIVACY: phrases here are detector vocabulary, never message content. The
# engine never stores the matched message text in evidence — only redacted
# excerpts (see redact.rs).

lang = "en"

# -- The nine grooming indicator categories --------------------------------

# SOFT secrecy: a secrecy *framing* that can have an innocent reading (a surprise
# party, a gift). Kept low-weight so a lone hit doesn't over-block.
[grooming.secrecy]
phrases = [
  "our little secret",
  "our secret",
  "keep this between us",
  "keep it between us",
  "just between us",
  "no one needs to know",
  "this stays between you and me",
]
patterns = [
  "\\bkeep (this|it|us) (a )?secret\\b",
]

# HARD secrecy — guardian isolation / evidence destruction. Almost no innocent
# reading, so it's weighted as a strong, alert-on-its-own signal (engine.rs).
[grooming.secrecy_isolation]
phrases = [
  "don't tell your parents",
  "dont tell your parents",
  "don't tell anyone",
  "dont tell anyone",
  "don't tell your mom",
  "don't tell your mum",
  "don't tell your dad",
  "delete these messages",
  "delete this chat",
  "delete our chats",
  "make sure no one sees",
]
patterns = [
  "\\bdon'?t (let|tell) (anyone|anybody|your (mum|mom|dad|parents))\\b",
]

[grooming.platform_switching]
phrases = [
  "let's move to telegram",
  "lets move to telegram",
  "move to telegram",
  "let's move to discord",
  "move to discord",
  "let's move to snapchat",
  "move to snapchat",
  "let's chat on whatsapp",
  "add me on snap",
  "add me on snapchat",
  "add me on kik",
  "add me on discord",
  "what's your snap",
  "whats your snap",
  "what's your kik",
  "download this app",
  "download the app",
  "get this app so we can talk",
  "i'll text you there",
  "ill text you there",
  "message me on",
  "let's talk somewhere else",
  "lets talk somewhere else",
  "talk somewhere more private",
  "move this to a private chat",
  "switch to a private app",
]
patterns = [
  "\\b(move|switch|come|chat|talk|hop) (to|on|over to) (telegram|discord|snapchat|snap|kik|whatsapp|signal|wickr|insta(gram)?)\\b",
  "\\badd me on (telegram|discord|snap(chat)?|kik|whatsapp|signal|wickr)\\b",
]

[grooming.personal_info_age_probing]
phrases = [
  "how old are you",
  "what's your age",
  "whats your age",
  "what is your age",
  "what's your address",
  "whats your address",
  "where do you live",
  "what school do you go to",
  "what's your school",
  "which school do you go to",
  "are your parents home",
  "is anyone home",
  "are you home alone",
  "when are you alone",
  "when are you home alone",
  "are you alone right now",
  "what's your phone number",
  "whats your number",
  "send me your number",
  "what's your real name",
  "what grade are you in",
  "do your parents check your phone",
]
patterns = [
  "\\bhow old (are|r) (you|u|ya)\\b",
  "\\bwhat (grade|year) (are|r) (you|u) in\\b",
  "\\bwhen (are|r) (you|u|your parents) (home )?alone\\b",
]

[grooming.sexualization]
phrases = [
  "do you have a boyfriend",
  "do you have a girlfriend",
  "do you have a bf",
  "do you have a gf",
  "have you ever kissed",
  "have you kissed anyone",
  "are you a virgin",
  "have you done it",
  "what are you wearing",
  "what do you wear to bed",
  "do you touch yourself",
  "send a pic",
  "send a sexy pic",
  "you're so sexy",
  "youre so sexy",
  "you look so hot",
  "you're really mature for your age",
  "you seem mature for your age",
  "have you ever sexted",
  "do you like older guys",
  "do you like older men",
]
patterns = [
  # age-conditioned sexual compliment, e.g. "you're sexy for 13"
  "\\b(you'?re|ur|you are|you look) (so |really |very )?(sexy|hot|cute|fit) for (a )?(\\d{1,2}|your age)\\b",
  "\\b(ever|have you) (kissed|sexted|had sex)\\b",
]

[grooming.gifts_bribery]
phrases = [
  "i'll buy you",
  "ill buy you",
  "i will buy you",
  "i can buy you",
  "i'll get you a",
  "gift card",
  "amazon card",
  "send you money",
  "i'll send you money",
  "i'll pay you",
  "ill pay you",
  "i'll top up your phone",
  "buy you a new phone",
  "buy you robux",
  "buy you v-bucks",
  "buy you vbucks",
  "if you do this for me",
  "if you do something for me",
  "do this for me and i'll",
]
patterns = [
  "\\bi'?ll (buy|get|send|give) (you|u) (a |some |\\$)?\\w+",
  "\\b(robux|v-?bucks|gift\\s?card|amazon (card|voucher))\\b",
]

[grooming.emotional_manipulation]
phrases = [
  "your parents don't understand you",
  "your parents dont understand you",
  "i understand you better than anyone",
  "i'm the only one who understands you",
  "you're the only one i can talk to",
  "youre the only one i can talk to",
  "no one else gets me like you",
  "i love you",
  "you're so special to me",
  "youre so special to me",
  "i think about you all the time",
  "you can trust me",
  "you're more mature than your friends",
  "if you really loved me",
  "if you really cared about me",
  "don't you trust me",
  "dont you trust me",
  "i'd be so sad if you stopped talking to me",
]
patterns = [
  "\\byour parents (don'?t|do not) (understand|get) (you|u)\\b",
  "\\b(you'?re|ur) the only (one|person) (i can|i could) (talk to|trust)\\b",
  "\\bif you (really )?(loved|cared about|liked) me\\b",
]

[grooming.boundary_testing]
phrases = [
