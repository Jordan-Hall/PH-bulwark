[package]
name = "bulwark-child"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "PH Bulwark child app — Dioxus 0.8 onboarding/setup journey (UI). The native Android OS services (VpnService/Accessibility/DeviceAdmin in platform/android) bridge in via java_plugin! on the mobile target."

# Platform features map to the matching dioxus renderer — dx enables the right one
# per target (`dx serve` = desktop; `dx build --platform android` = mobile; web).
# default = desktop for dev/preview; the volunteer device build is
# `dx build --platform android` (the native OS services bridge via java_plugin!).
[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
web = ["dioxus/web"]

[dependencies]
# Dioxus 0.8 (alpha) — same multiplatform line as the parent + labeling apps.
# Keep dioxus' default features (the rsx!/#[component] macros, hooks, signals);
# the RENDERER is added by the platform features above, not hard-enabled here.
# Dioxus 0.8 (alpha) — matches the installed dx CLI (0.8.0-alpha.0).
# NATIVE-RENDERER NOTE: `--renderer native` (Blitz) is unbuildable on this toolchain —
# the published 0.8.0-alpha.0 `dioxus-native` pulls Blitz 0.3.0-alpha.4 with an internal
# `image` conflict (blitz-dom =0.25.6 vs anyrender_svg 0.25.10). The fix PRs (#5507/#5563)
# are on newer dioxus that needs a newer dx CLI. Revisit native after upgrading BOTH the
# dx CLI and dioxus to a consistent post-fix release; until then the renderer is webview.
dioxus = { version = "0.8.0-alpha.0", features = ["router"] }

# Detached from the core cargo workspace (like apps/parent) so the engine build
# stays lean and isn't blocked by the UI tree.
[workspace]
