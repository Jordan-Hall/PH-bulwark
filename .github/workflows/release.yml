name: release

# Build the Linux server binaries and attach them to the GitHub Release on a
# version tag (or manual dispatch). Android signed APK + desktop signing are
# documented in docs/release.md (they need keystores/certs as secrets).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-binaries:
    name: linux server binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release (aegis-server + aegis_admin)
        run: cargo build --release -p aegis-server
      - name: Stage artifacts + checksums
        run: |
          mkdir -p dist
          cp target/release/aegis-server target/release/aegis_admin dist/
          (cd dist && sha256sum aegis-server aegis_admin > SHA256SUMS)
      - name: Attach to the GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
      - name: Upload as a workflow artifact (manual dispatch)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: aegis-server-linux
          path: dist/*
