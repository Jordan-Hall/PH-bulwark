name: prerelease

# Every merge to master → build ALL apps (child + adult) on ALL platforms IN
# PARALLEL and publish them to a single rolling GitHub **pre-release** ("latest")
# so testers can download + install the newest build straight away.
#
#   child  → Android APK (sideload) + Windows desktop filter (bulwark_proxy/vpn/svc)
#   adult  → console (bulwark-parent) on Windows / macOS / Linux
#   server → bulwark-server (Linux)
#
# Unsigned (testing): Android = debug APK; desktop = raw binaries (SmartScreen /
# Gatekeeper will warn). Signed store builds go through release.yml / store-publish.yml.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: prerelease
  cancel-in-progress: true

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  android:
    name: child APK (Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: |
          sdkmanager "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi" }
      - run: cargo install cargo-ndk --locked
      - name: Build JNI libs
        working-directory: platform/android/rust/bulwark-android
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -o ../../app/src/main/jniLibs build --release
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        working-directory: platform/android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Stage
        run: |
          mkdir -p out
          cp platform/android/app/build/outputs/apk/debug/*-debug.apk out/ph-bulwark-child-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/* }

  windows:
    name: child filter + adult console (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p bulwark-client
      - run: cargo build --release --manifest-path apps/parent/Cargo.toml
      - name: Stage
        shell: bash
        run: |
          mkdir -p out
          for b in bulwark_proxy bulwark_vpn bulwark_svc; do
            [ -f "target/release/$b.exe" ] && cp "target/release/$b.exe" out/ || true
          done
          cp apps/parent/target/release/*.exe out/ 2>/dev/null || true
          ls -la out/
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out/* }

  macos:
    name: adult console (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --manifest-path apps/parent/Cargo.toml
      - name: Stage
        run: |
          mkdir -p out
          cp apps/parent/target/release/bulwark-parent out/ph-bulwark-manager-macos 2>/dev/null || true
          ls -la out/
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: out/* }

  linux:
    name: server + adult console (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p bulwark-server
      - name: Adult console (needs webkit2gtk; non-fatal if deps drift)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev || true
          cargo build --release --manifest-path apps/parent/Cargo.toml || echo "::warning::linux adult console build skipped"
      - name: Stage
        run: |
          mkdir -p out
          cp target/release/bulwark-server out/ph-bulwark-server-linux 2>/dev/null || true
          cp target/release/bulwark_admin out/ph-bulwark-admin-linux 2>/dev/null || true
          cp apps/parent/target/release/bulwark-parent out/ph-bulwark-manager-linux 2>/dev/null || true
          ls -la out/
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: out/* }

  publish:
    name: publish rolling pre-release
    needs: [android, windows, macos, linux]
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Gather artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist/ || echo "no artifacts"
      - name: Publish / update the 'latest' pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prerelease-latest
          name: "PH Bulwark — latest pre-release"
          prerelease: true
          target_commitish: master
          files: dist/*
          body: |
            **Automated pre-release** of the latest `master` (commit ${{ github.sha }}).
            Unsigned test builds — install at your own risk:
            - **Android (child):** `ph-bulwark-child-android.apk` — enable "install unknown apps" + sideload.
            - **Windows (child filter):** `bulwark_proxy.exe` / `bulwark_vpn.exe` / `bulwark_svc.exe` — SmartScreen will warn (unsigned).
            - **Windows/macOS/Linux (adult console):** `ph-bulwark-manager-*` / `*.exe`.
            - **Linux (server):** `ph-bulwark-server-linux`.
