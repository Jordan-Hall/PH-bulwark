# Bulwark cluster inventory — copy to inventory.ini, fill in your Ubuntu host IPs,
# then:   ansible-playbook -i deploy/ansible/inventory.ini deploy/ansible/site.yml
#
# SCALE OUT by adding more [workers] IPs and re-running (every task is idempotent).

[lb]
10.0.0.10

[workers]
10.0.0.11
10.0.0.12

# All Bulwark nodes (just groups the above — don't edit).
[bulwark:children]
lb
workers

[bulwark:vars]
ansible_user=ubuntu
# A pre-built image your hosts can pull. Build + push once from the repo root:
#   docker build -f deploy/docker/Dockerfile --build-arg FEATURES=gossip,quorum \
#       -t <registry>/bulwark-server:latest .
#   docker push <registry>/bulwark-server:latest
bulwark_image=ghcr.io/your-org/bulwark-server:latest
bulwark_port=8443
bulwark_cluster_id=bulwark-prod
# Optional shared Postgres DSN for the quorum lease store (split-brain safety);
# leave empty to skip quorum.
bulwark_quorum_dsn=
