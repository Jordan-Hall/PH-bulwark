[package]
name = "bulwark-parent"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Bulwark parent console — all-Rust Dioxus UI over the shared core."

[dependencies]
# All-Rust UI, migrated to the Dioxus 0.8 line (shared with the labeling app), so
# the same RSX can target desktop now and mobile/native (Blitz) next. `desktop`
# covers Windows + macOS. NOTE: 0.8 is alpha — the dx CLI must be installed with
# --locked; the library builds with plain cargo.
dioxus = { version = "0.8.0-alpha.0", features = ["desktop", "router"] }

# The parent console is just another Rust client of the shared core: it speaks
# the SAME gRPC contract the cluster serves (no FFI bridge). It only uses the
# LEGITIMATE services — AlertRelay (guardian alerts) + Review (approve/deny) +
# read-only coverage. It does NOT import any device-control surface.
bulwark-proto = { path = "../../crates/bulwark-proto" }
tonic = { version = "0.14", features = ["tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# App-lock PIN hashing (see `lock.rs`). `ring` is ALREADY in the build as a
# transitive dep of tonic's `tls-ring` feature, so declaring it directly adds ZERO
# new crates to the lock — it reuses the SAME PBKDF2-HMAC-SHA256 primitive the
# server uses for guardian passwords. Permissive (MIT/ISC/OpenSSL-style) licensing.
ring = "0.17"

# QR rendering for the child-pairing code (MIT/Apache). SVG-only: default features
# pull in the heavy `image` crate we don't need, so disable them and keep just
# `svg`, which emits a self-contained SVG string we drop into the rsx.
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }

# Clipboard for the "copy recovery code" button (MIT/Apache). Desktop-only need;
# `image` default feature is unneeded (we only copy text), so keep it lean.
arboard = { version = "3", default-features = false }

[dev-dependencies]
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["net"] }

# Control-panel plumbing (Windows-only, used by the Protection toggle):
# - winreg flips the per-user WinINET proxy (HKCU, no admin) on Connect/Disconnect.
# - windows/Win32_Networking_WinInet notifies already-open browsers to re-read the
#   proxy setting (InternetSetOption SETTINGS_CHANGED + REFRESH); Win32_Foundation
#   pulls in the shared BOOL/handle types those signatures use.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.60", features = ["Win32_Networking_WinInet", "Win32_Foundation"] }

# Detached from the core cargo workspace so the verified `cargo build --workspace`
# (the engine crates) doesn't pull the heavy Dioxus UI tree. This app builds on
# its own: `cd apps/parent && cargo run`.
[workspace]
