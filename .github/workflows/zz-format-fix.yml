name: One-shot rustfmt repair

on:
  push:
    branches:
      - production-readiness/full-hardening

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.repository == 'Jordan-Hall/PH-bulwark'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: production-readiness/full-hardening
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit canonical rustfmt output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'chore: apply canonical rustfmt output'
          git push origin HEAD:production-readiness/full-hardening
