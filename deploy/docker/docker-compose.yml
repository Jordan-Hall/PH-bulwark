# Single-node bulwark-server (cluster tier) for a VPS / home server. Run from here:
#
#   docker compose -f deploy/docker/docker-compose.yml up -d --build
#
# Accounts mode is ON here; provision guardians with the bundled bulwark_admin:
#   docker compose exec -e BULWARK_ADMIN_PASSWORD='…' bulwark-server \
#       bulwark_admin create-account guardian@home.example "Guardian"
#
# For production: terminate mTLS (mount certs + set tls in bulwark-core config),
# set the SMTP/FCM env below, and put this behind a TLS-terminating reverse proxy
# or supply the server's own cert material.
services:
  bulwark-server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      # args: { FEATURES: push }   # uncomment to bake in the FCM push sink
    image: bulwark-server:latest
    command: ["--role", "all-in-one"]
    ports:
      - "8443:8443"
    environment:
      BULWARK_BIND: "0.0.0.0:8443"
      BULWARK_ACCOUNTS: "1"
      BULWARK_STATE_DIR: "/var/lib/bulwark"
      # --- email alerts (all three or none) ---
      # BULWARK_SMTP_HOST: "smtp.example.com"
      # BULWARK_ALERT_FROM: "Predator Hunters Bulwark <bulwark@home.example>"
      # BULWARK_ALERT_RECIPIENTS: "guardian@home.example"
      # --- FCM push (needs FEATURES=push + a mounted service-account key) ---
      # BULWARK_FCM_PROJECT_ID: "your-gcp-project"
      # BULWARK_FCM_SERVICE_ACCOUNT: "/run/secrets/fcm-sa.json"
    volumes:
      - bulwark-state:/var/lib/bulwark
    restart: unless-stopped

volumes:
  bulwark-state:
