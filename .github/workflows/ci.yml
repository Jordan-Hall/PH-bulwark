name: ci

# The build/test/clippy/deny sequence from docs/running.md §2, run on a networked
# compiler (GitHub Actions). This is the verification that cannot run in the
# offline dev sandbox — pushing this repo makes it run automatically.
#
# Note: bulwark-proto's build.rs compiles the .proto hermetically via `protox`
# (pure Rust), so NO system `protoc` install is needed in CI.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy-test:
    name: clippy + build + test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets
      - name: build
        run: cargo build --workspace --locked
      - name: test
        run: cargo test --workspace --locked

  msrv:
    name: minimum Rust 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.88.0 check --locked --workspace --all-targets

  features:
    name: feature (${{ matrix.command }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command:
          - build -p bulwark-text --features classifier
          - test -p bulwark-vision --features onnx
          - test -p bulwark-infer --features onnx
          - test -p bulwark-video --features ffmpeg
          - build -p bulwark-audio --features whisper
          - build -p bulwark-ui --features llm-explain
          - build -p bulwark-cluster --features gossip,quorum
          - test -p bulwark-alert --features push
          - build -p bulwark-server --features push
          - build -p bulwark-server --features classifier
          - build -p bulwark-server --features onnx
          - build -p bulwark-server --features whisper
          - build -p bulwark-server --features ffmpeg
          - test -p bulwark-server --features onnx,whisper,ffmpeg
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install FFmpeg for real decode tests
        if: contains(matrix.command, 'ffmpeg')
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo ${{ matrix.command }} --locked

  feature-gate:
    name: feature builds (linux)
    runs-on: ubuntu-latest
    needs: features
    if: always()
    steps:
      - name: Require every feature check to pass
        env:
          FEATURES_RESULT: ${{ needs.features.result }}
        run: test "$FEATURES_RESULT" = success

  windows-build:
    name: windows-gated crates (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # bulwark-net's Wintun + DPAPI + cert-store FFI only compiles on Windows.
      - run: cargo build -p bulwark-net -p bulwark-client

  staff-console:
    name: staff console (apps/staff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/staff
      # apps/staff is a DETACHED cargo workspace (own [workspace]) — NOT covered by
      # the `--workspace` jobs above. It's a Dioxus 0.8 desktop app, so its desktop
      # renderer (wry) links WebKitGTK at build time: install the documented apt set
      # (identical to the apps/parent desktop build in release.yml/prerelease.yml).
      - name: Install WebKitGTK build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - name: fmt
        run: cargo fmt --manifest-path apps/staff/Cargo.toml --all --check
      - name: clippy
        run: cargo clippy --manifest-path apps/staff/Cargo.toml --all-targets
      - name: test
        run: cargo test --manifest-path apps/staff/Cargo.toml

  rom-safety:
    name: ROM safety FFI core (platform/rom/libbulwark_safety/rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: platform/rom/libbulwark_safety/rust
      # platform/rom/libbulwark_safety/rust is a DETACHED cargo workspace (own
      # [workspace]) — NOT covered by the `--workspace` jobs above. It's a non-GUI
      # staticlib/cdylib (the Child Safety ROM's C-ABI scoring core), so no WebKitGTK
      # deps are needed. This is the DEFAULT (no-onnx) build: every score fails CLOSED,
      # which is exactly what we want CI to verify (the ABI + fail-closed structure
      # compile + test on any host). The real `onnx` scorer path is proven separately
      # by cross-compiling to aarch64-linux-android via cargo-ndk (see PR #223).
      - name: fmt
        run: cargo fmt --manifest-path platform/rom/libbulwark_safety/rust/Cargo.toml --all --check
      - name: clippy
        run: cargo clippy --manifest-path platform/rom/libbulwark_safety/rust/Cargo.toml --all-targets -- -D warnings
      - name: test
        run: cargo test --manifest-path platform/rom/libbulwark_safety/rust/Cargo.toml

  deny:
    name: cargo-deny (licenses + advisories + bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny --locked check
