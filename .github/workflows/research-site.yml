name: research-site

# Build the Predator Hunters Research static site image in CI, push to GHCR,
# then have the EC2 box docker-PULL + run it via AWS SSM (same no-SSH pattern as
# deploy.yml). The box only RUNS the prebuilt nginx image (a few MB).
#
# Serves research.predatorhunters.co.uk. TLS is terminated at the Cloudflare
# edge (subdomain proxied — record already created), so the container speaks
# plain HTTP; the deploy maps it to host port 80 (Cloudflare → origin on :80
# under SSL mode "Flexible"; switch to "Full" only with origin TLS).
#
# Gated on the GitHub Environment `production`. Reuses the SAME deploy secrets
# as deploy.yml:
#   secret AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  (ph-bulwark-deployer; ssm:SendCommand)
#   var    AWS_REGION         e.g. eu-west-2
#   var    AWS_INSTANCE_ID    the EC2 instance id (SSM-managed)
#   var    RESEARCH_PORT      optional host port, default 80
#
# ONE-TIME prerequisites (outside CI — see deploy/research/README.md):
#   * Cloudflare: proxied A record `research` → box IP  ✅ DONE.
#   * Cloudflare: SSL/TLS mode "Flexible" (origin :80) — or "Full" with origin TLS.
#   * Security group: allow the chosen RESEARCH_PORT (80) inbound, ideally
#     restricted to Cloudflare IP ranges. (Needs EC2 perms the deploy IAM lacks.)

on:
  push:
    branches: [master]
    paths:
      - apps/research/**
      - deploy/research/**
      - branding/**
      - .github/workflows/research-site.yml
  workflow_dispatch: {}

concurrency:
  group: deploy-research
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/jordan-hall/research-site

jobs:
  build-image:
    name: build + push research-site image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the wasm bundle into an nginx image
        run: |
          set -euo pipefail
          docker build -f deploy/research/Dockerfile \
            -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" .
      - name: Smoke test — nginx serves the bundle
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8099:80 "$IMAGE:${GITHUB_SHA}"
          sleep 4
          curl -fsS http://127.0.0.1:8099/healthz
          curl -fsS http://127.0.0.1:8099/ | grep -qi "<!DOCTYPE html" \
            || { echo "::error::index.html not served"; docker logs smoke; exit 1; }
          docker rm -f smoke
      - name: Push to GHCR
        run: |
          set -euo pipefail
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

  deploy:
    name: redeploy research-site via SSM (pull, no build, no SSH)
    needs: build-image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Configure AWS credentials (scoped deploy user)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Redeploy via SSM Run Command
        env:
          IID: ${{ vars.AWS_INSTANCE_ID }}
          RESEARCH_PORT: ${{ vars.RESEARCH_PORT }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PORT="${RESEARCH_PORT:-80}"
          REF="${IMAGE}:${GITHUB_SHA}"
          # `set -eu` (NOT -eux) on the box so the GHCR token isn't echoed.
          cat > params.json <<JSON
          {"commands":[
            "set -eu",
            "echo '${GHCR_TOKEN}' | docker login ghcr.io -u '${GHCR_USER}' --password-stdin",
            "docker pull '${REF}'",
            "docker rm -f research-site || true",
            "docker run -d --name research-site --restart unless-stopped -p ${PORT}:80 '${REF}'",
            "sleep 4",
            "docker ps --filter name=research-site --format '{{.Status}}' | grep -q Up || { docker logs --tail 50 research-site; exit 1; }",
            "docker logout ghcr.io || true",
            "docker image prune -f || true"
          ]}
          JSON
          CID=$(aws ssm send-command --instance-ids "$IID" \
            --document-name AWS-RunShellScript --comment "research-site redeploy (pull)" \
            --parameters file://params.json --query Command.CommandId --output text)
          echo "SSM command: $CID"
          for i in $(seq 1 30); do
            ST=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $ST"
            case "$ST" in
              Success) break;;
              Failed|Cancelled|TimedOut)
                echo "::error::SSM redeploy $ST"
                aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardErrorContent --output text
                exit 1;;
            esac
            sleep 10
          done
          [ "$ST" = "Success" ] || { echo "::error::SSM redeploy timed out (last: $ST)"; exit 1; }
          echo "=== output ==="
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardOutputContent --output text
