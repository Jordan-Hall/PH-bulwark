[package]
name = "bulwark-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bulwark-proto = { path = "../bulwark-proto" }
bulwark-core = { path = "../bulwark-core" }
bulwark-net = { path = "../bulwark-net" }
bulwark-flow = { path = "../bulwark-flow" }
bulwark-infer = { path = "../bulwark-infer" }
bulwark-policy = { path = "../bulwark-policy" }
bulwark-alert = { path = "../bulwark-alert" }
bulwark-store = { path = "../bulwark-store" }
# Embedded guardian dashboard for the runnable binaries: the coverage matrix
# is derived LIVE from the pinning registry (a CoverageSource closure over
# NetInterceptor::pinning_snapshot).
bulwark-ui = { path = "../bulwark-ui" }
bulwark-text = { path = "../bulwark-text" }
# Local NSFW image scoring. Default build uses its fail-OPEN stub; the `onnx`
# feature turns on bulwark-vision/onnx for real scoring (see [features]).
bulwark-vision = { path = "../bulwark-vision" }
# Buffered-video analysis: samples frames/audio (ffmpeg sidecar, gated) and
# retains blocked/borderline NON-CSAM segments in a local SegmentStore so the
# guardian app can replay the clip (verdict.local_segment_uri). Default features
# = no ffmpeg (NullDemuxer fail-open) so the default build links without ffmpeg.
bulwark-video = { path = "../bulwark-video" }
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
# Downscale + re-encode the blocked image into a small SAFE preview for the
# AlertEvent (non-CSAM only). Same decoder set as bulwark-vision.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
# AlertRelay gRPC client (RaiseAlert) used by the runnable bulwark_proxy binary.
tonic.workspace = true
# SHA-256 for Evidence.sha256 (hash-only audit of analysed media).
ring.workspace = true

[dev-dependencies]
# Construct CapturedFlow payloads (HttpHead.body_peek: Bytes) in tests.
bytes.workspace = true

# SCM service-control handler for the `bulwark_svc` bin (Windows-only). Safe wrapper
# over StartServiceCtrlDispatcher / RegisterServiceCtrlHandlerEx; uses windows-sys
# internally so it doesn't clash with the `windows` 0.60 facade elsewhere.
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[features]
default = []
# Real local NSFW scoring via ONNX Runtime. Forwards to bulwark-vision's `onnx`
# feature (which gates the `ort` dependency). Absent → fail-OPEN stub, so the
# DEFAULT build stays green with no model and no onnxruntime.dll.
onnx = ["bulwark-vision/onnx"]
# Real video frame/audio sampling via the ffmpeg sidecar (else NullDemuxer
# fail-opens). Pairs with `onnx` for actual frame scoring on the video path.
ffmpeg = ["bulwark-video/ffmpeg"]
