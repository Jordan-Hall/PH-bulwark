# Build every installable PH Bulwark Android APK in CI.
#
# Shipping Android applications:
#   child   -> co.predatorhunters.bulwark          (Gradle :app + Rust JNI)
#   camera  -> co.predatorhunters.bulwark.camera   (Gradle :camera)
#   manager -> co.predatorhunters.bulwark.manager  (Dioxus apps/parent)
#
# CI intentionally emits DEBUG APKs here: Android/Gradle signs debug builds
# automatically, so every artifact can be sideloaded directly without repository
# signing secrets. The release workflow remains responsible for production
# release signing. A final bundle artifact contains all three stable filenames.
name: android

on:
  push:
    branches: ["**"]
    paths:
      - "platform/android/**"
      - "apps/parent/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "platform/android/**"
      - "apps/parent/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}
  workflow_call: {}

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  ANDROID_NDK_VERSION: "26.3.11579264"
  ANDROID_PLATFORM: "android-34"
  ANDROID_BUILD_TOOLS: "34.0.0"

jobs:
  child-apk:
    name: child + camera installable APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4

      - name: Install Android toolchain
        run: |
          sdkmanager "ndk;$ANDROID_NDK_VERSION" "platforms;$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            platform/android/rust/bulwark-android/target
          key: ${{ runner.os }}-cargo-ndk-${{ hashFiles('platform/android/rust/bulwark-android/Cargo.lock') }}

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked

      - name: Build child JNI library
        working-directory: platform/android/rust/bulwark-android
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -o ../../app/src/main/jniLibs \
            build --release

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Assemble child + camera debug APKs
        working-directory: platform/android
        run: gradle :app:assembleDebug :camera:assembleDebug --no-daemon --stacktrace

      - name: Stage and verify installable APKs
        working-directory: platform/android
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ph-bulwark-child-debug.apk
          cp camera/build/outputs/apk/debug/camera-debug.apk dist/ph-bulwark-camera-debug.apk
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/apksigner"
          "$APKSIGNER" verify --verbose dist/ph-bulwark-child-debug.apk
          "$APKSIGNER" verify --verbose dist/ph-bulwark-camera-debug.apk

      - name: Upload child debug APK
        uses: actions/upload-artifact@v6
        with:
          name: bulwark-child-debug-apk
          path: platform/android/dist/ph-bulwark-child-debug.apk
          if-no-files-found: error

      - name: Upload camera debug APK
        uses: actions/upload-artifact@v6
        with:
          name: bulwark-camera-debug-apk
          path: platform/android/dist/ph-bulwark-camera-debug.apk
          if-no-files-found: error

  manager-apk:
    name: parent Manager installable APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4

      - name: Install Android toolchain
        run: |
          sdkmanager "ndk;$ANDROID_NDK_VERSION" "platforms;$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up Rust + arm64 Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Manager Android build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/dx
            apps/parent/target
          key: ${{ runner.os }}-cargo-manager-android-v1-${{ hashFiles('apps/parent/Cargo.toml', 'apps/parent/Dioxus.toml') }}

      - name: Install Dioxus CLI
        run: command -v dx >/dev/null || cargo install dioxus-cli --version 0.8.0-alpha.0 --locked

      - name: Export NDK cross-compiler environment
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android34-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android34-clang" >> "$GITHUB_ENV"

      - name: Build Manager debug APK for physical Android phones
        working-directory: apps/parent
        run: dx build --platform android --target aarch64-linux-android

      - name: Apply Manager launcher resources and repackage
        working-directory: apps/parent
        run: |
          set -euo pipefail
          GEN="target/dx/bulwark-parent/debug/android/app"
          RES="$GEN/app/src/main/res"
          test -d "$RES"
          cp android/res/drawable/ic_launcher_background.xml "$RES/drawable/ic_launcher_background.xml"
          mkdir -p "$RES/drawable-v24"
          cp android/res/drawable-v24/ic_launcher_foreground.xml "$RES/drawable-v24/ic_launcher_foreground.xml"
          chmod +x "$GEN/gradlew"
          (cd "$GEN" && ./gradlew assembleDebug --no-daemon --stacktrace)

      - name: Stage and verify Manager installable APK
        working-directory: apps/parent
        run: |
          set -euo pipefail
          RAW="target/dx/bulwark-parent/debug/android/app/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$RAW"
          mkdir -p dist
          cp "$RAW" dist/ph-bulwark-manager-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify --verbose dist/ph-bulwark-manager-debug.apk

      - name: Upload Manager debug APK
        uses: actions/upload-artifact@v6
        with:
          name: bulwark-manager-debug-apk
          path: apps/parent/dist/ph-bulwark-manager-debug.apk
          if-no-files-found: error

  android-apk-bundle:
    name: all installable Android APKs
    needs: [child-apk, manager-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Download child APK
        uses: actions/download-artifact@v5
        with:
          name: bulwark-child-debug-apk
          path: dist

      - name: Download camera APK
        uses: actions/download-artifact@v5
        with:
          name: bulwark-camera-debug-apk
          path: dist

      - name: Download Manager APK
        uses: actions/download-artifact@v5
        with:
          name: bulwark-manager-debug-apk
          path: dist

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          test -f ph-bulwark-child-debug.apk
          test -f ph-bulwark-camera-debug.apk
          test -f ph-bulwark-manager-debug.apk
          sha256sum *.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Upload complete Android install bundle
        uses: actions/upload-artifact@v6
        with:
          name: ph-bulwark-android-installable-apks
          path: dist/*
          if-no-files-found: error
