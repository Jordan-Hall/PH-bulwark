---
# Deploy-as-code for the Bulwark cluster tier. Give it Ubuntu host IPs (inventory);
# it installs Docker and runs bulwark-server on each node — one LB/coordinator + N
# workers that seed off the LB. Scale by adding [workers] IPs and re-running; every
# task is idempotent.
#
# Requires the collections in requirements.yml:
#   ansible-galaxy collection install -r deploy/ansible/requirements.yml

- name: Provision Bulwark nodes (Docker + firewall + state dir)
  hosts: bulwark
  become: true
  tasks:
    - name: Install Docker engine
      ansible.builtin.apt:
        name: docker.io
        state: present
        update_cache: true

    - name: Ensure Docker is running and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create the durable state directory
      ansible.builtin.file:
        path: /var/lib/bulwark
        state: directory
        mode: "0750"

    - name: Allow the Bulwark gRPC port (best-effort; skip if ufw absent)
      community.general.ufw:
        rule: allow
        port: "{{ bulwark_port }}"
        proto: tcp
      failed_when: false

    - name: Pull the bulwark-server image
      community.docker.docker_image:
        name: "{{ bulwark_image }}"
        source: pull
        force_source: true

- name: Run the load-balancer / coordinator node
  hosts: lb
  become: true
  tasks:
    - name: Run bulwark-server (role lb)
      community.docker.docker_container:
        name: bulwark-server
        image: "{{ bulwark_image }}"
        command: ["--role", "lb"]
        restart_policy: unless-stopped
        recreate: true
        published_ports:
          - "{{ bulwark_port }}:{{ bulwark_port }}"
        volumes:
          - /var/lib/bulwark:/var/lib/bulwark
        env:
          BULWARK_BIND: "0.0.0.0:{{ bulwark_port }}"
          BULWARK_ACCOUNTS: "1"
          # TODO(P1): provision per-node TLS like deploy/aws (BULWARK_TLS_CERT/KEY)
          # and drop this override — the cluster playbook is testing-grade today.
          BULWARK_ALLOW_PLAINTEXT: "1"
          BULWARK_STATE_DIR: "/var/lib/bulwark"
          BULWARK_NODE_ID: "{{ inventory_hostname }}"
          BULWARK_CLUSTER_ID: "{{ bulwark_cluster_id }}"
          BULWARK_CLUSTER_ADDRESS: "{{ inventory_hostname }}:{{ bulwark_port }}"
          BULWARK_QUORUM_DSN: "{{ bulwark_quorum_dsn | default('') }}"

- name: Run the worker nodes (seed off the LB)
  hosts: workers
  become: true
  vars:
    bulwark_lb_address: "{{ hostvars[groups['lb'][0]].inventory_hostname }}:{{ bulwark_port }}"
  tasks:
    - name: Run bulwark-server (role worker)
      community.docker.docker_container:
        name: bulwark-server
        image: "{{ bulwark_image }}"
        command: ["--role", "worker"]
        restart_policy: unless-stopped
        recreate: true
        published_ports:
          - "{{ bulwark_port }}:{{ bulwark_port }}"
        volumes:
          - /var/lib/bulwark:/var/lib/bulwark
        env:
          BULWARK_BIND: "0.0.0.0:{{ bulwark_port }}"
          BULWARK_STATE_DIR: "/var/lib/bulwark"
          BULWARK_NODE_ID: "{{ inventory_hostname }}"
          BULWARK_CLUSTER_ID: "{{ bulwark_cluster_id }}"
          BULWARK_CLUSTER_ADDRESS: "{{ inventory_hostname }}:{{ bulwark_port }}"
          BULWARK_CLUSTER_SEEDS: "{{ bulwark_lb_address }}"
          BULWARK_QUORUM_DSN: "{{ bulwark_quorum_dsn | default('') }}"
