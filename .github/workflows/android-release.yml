name: android-release

# Build the SIGNED Android release APKs and attach them to the GitHub Release,
# so the self-hosted FOSS distribution channels can pull them:
#   * Obtainium points straight at these Release assets (auto-updates by tag);
#   * the self-hosted F-Droid repo (fdroid/) mirrors the same APKs;
#   * Accrescent takes the signed child APK for its own submission/signing.
# See docs/distribution.md for the full channel map.
#
# THREE shipping APKs, from TWO build systems:
#   :app     -> co.predatorhunters.bulwark          (child VpnService filter)  -> app-release.apk      } gradle (release-apks job)
#   :camera  -> co.predatorhunters.bulwark.camera   (local-only safe camera)   -> camera-release.apk   }
#   Manager  -> co.predatorhunters.bulwark.manager  (guardian console, Dioxus) -> manager-release.apk  } dx (manager-apk job)
# The Manager (apps/parent) is a `dx`-built Dioxus app on a DETACHED workspace,
# so it gets its OWN job (manager-apk) — see that job's header for the two
# dx-on-Android constraints (arm64 ABI pin + NDK cross-compiler env) and why it
# signs explicitly (dx has no Android signing config of its own).
#
# Signing is gated on the ANDROID_* secrets being present — EXACTLY like
# platform/android/{app,camera}/build.gradle.kts self-gate their signingConfig.
# When the secrets are absent the job still succeeds and ships UNSIGNED APKs
# plus a ::notice:: (so a release never silently fails for want of a keystore).
#
# Env/NDK/cargo-ndk setup mirrors android-emulator.yml; the release-asset upload
# mirrors release.yml (tag/Release -> action-gh-release; manual -> artifact).

# Primary trigger is the `v*` tag push: a Release created by release.yml uses the
# default GITHUB_TOKEN, and GitHub does NOT fire `release: published` for runs
# triggered that way — so without `push.tags` the signed APKs would never build
# for an automated release (the assets Obtainium/F-Droid pull would be missing).
# The `release` trigger is kept for releases published by hand in the UI.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch: {}

# Required so action-gh-release can attach assets to the Release; without it the
# upload silently 403s (the emulator workflow we mirror has no upload, hence no
# permissions block — release.yml does, and we copy it).
permissions:
  contents: write

# Same transient-crates.io-download hardening as android.yml / release.yml.
env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  release-apks:
    name: signed child + camera release APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4

      - name: Install NDK + export its path
        run: |
          sdkmanager "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
          # setup-android sets ANDROID_SDK_ROOT but NOT ANDROID_NDK_ROOT, so
          # cargo-ndk would see an empty NDK path. Pin the concrete NDK dir for
          # all subsequent steps (same as android-emulator.yml).
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Set up Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          # Three targets installed to mirror the emulator setup; the release
          # build only emits the two ARM ABIs (no x86_64 in a phone APK).
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platform/android/rust/bulwark-android/target
          key: ${{ runner.os }}-cargo-ndk-${{ hashFiles('platform/android/rust/bulwark-android/Cargo.lock') }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build child JNI lib (arm64-v8a + armeabi-v7a) into jniLibs
        # Only :app loads libbulwark_client.so; :camera ships no jniLibs of its
        # own (the ONNX Runtime AAR carries its per-ABI natives).
        working-directory: platform/android/rust/bulwark-android
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -o ../../app/src/main/jniLibs \
            build --release

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Signing-secret presence notice
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::notice title=Unsigned release APKs::No ANDROID_KEYSTORE_BASE64 secret — building UNSIGNED release APKs. Add the four ANDROID_* secrets to ship signed FOSS-store APKs (docs/distribution.md)."
          else
            echo "::notice title=Signed release APKs::Release keystore present — building SIGNED release APKs."
          fi

      - name: Assemble release APKs (:app + :camera)
        working-directory: platform/android
        # setup-gradle provides `gradle` (every workflow here uses it, matching
        # platform/android/README.md). The build.gradle signingConfig self-gates
        # on ANDROID_KEYSTORE_BASE64 being non-blank, so passing the secrets as
        # env here is enough — absent secrets => unsigned, present => signed.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :camera:assembleRelease --no-daemon --stacktrace

      - name: Stage APKs under stable asset names
        working-directory: platform/android
        # With signing the outputs are app-release.apk / camera-release.apk;
        # WITHOUT signing (minify off) Gradle emits *-release-unsigned.apk. Pick
        # whichever exists per module and rename to a STABLE asset name — these
        # exact names are referenced by the Obtainium config in
        # docs/distribution.md, so do not change them without updating that doc.
        run: |
          mkdir -p dist
          cp "$(find app/build/outputs/apk/release -name '*.apk' | head -n1)" dist/app-release.apk
          cp "$(find camera/build/outputs/apk/release -name '*.apk' | head -n1)" dist/camera-release.apk
          (cd dist && sha256sum app-release.apk camera-release.apk > SHA256SUMS-android-foss)
          ls -la dist/

      - name: Attach to the GitHub Release (tag push or published release)
        # A `v*` tag push (the primary path) and a hand-published release both
        # attach the signed APKs. action-gh-release upserts the release for the
        # ref's tag, so it works whether release.yml created it first or not.
        if: github.event_name == 'release' || github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: platform/android/dist/*

      - name: Upload as a workflow artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: ph-bulwark-foss-release-apks
          path: platform/android/dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # PH Bulwark MANAGER (apps/parent, Dioxus 0.8) -> manager-release.apk
  #
  # The Manager is a SEPARATE artifact from the gradle :app/:camera project: it is
  # a `dx`-built Dioxus app (detached cargo workspace), so it gets its own job —
  # NOT a step in release-apks. It joins the SAME FOSS channels (Obtainium /
  # F-Droid mirror) under the stable asset name `manager-release.apk`, kept in
  # lock-step with docs/distribution.md, fdroid/metadata/, and the Obtainium
  # source block. App id `co.predatorhunters.bulwark.manager` (coexists with the
  # child). See docs/distribution.md.
  #
  # TWO non-obvious dx-on-Android constraints baked in below (from CLAUDE.md):
  #   1. ABI: `dx build --platform android` defaults to an x86_64-only APK, which
  #      gets INSTALL_FAILED_NO_MATCHING_ABIS on an arm64 phone. The Pixel recipe
  #      uses `--device <id>` to force arm64; in CI there is no device, so we pin
  #      the ABI with the rustc triple via `--target aarch64-linux-android`.
  #   2. The Rust deps (ring, via tonic's tls-ring) need a C cross-compiler, so the
  #      NDK CC_/AR_/CARGO_TARGET_*_LINKER vars MUST be exported for the target.
  #
  # SIGNING: unlike :app/:camera, dx has NO Android signing config (its only
  # codesign support is Apple/iOS) — it emits an UNSIGNED release APK. So this job
  # signs explicitly with zipalign + apksigner using the SAME four ANDROID_*
  # secrets, self-gated exactly like release-apks: secrets present => signed,
  # absent => the UNSIGNED dx APK ships plus a ::notice:: (the build never fails
  # for want of a keystore). Keep ONE release keystore across all channels — both
  # Obtainium and F-Droid verify in-place updates are signed by the same key.
  manager-apk:
    name: signed Manager (apps/parent) release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4

      - name: Install NDK + export its path
        run: |
          sdkmanager "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Set up Rust + arm64 Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          # arm64 only — the phone ABI we pin below with --target.
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/parent/target
          key: ${{ runner.os }}-cargo-manager-${{ hashFiles('apps/parent/Cargo.toml') }}

      - name: Install the dx CLI (Dioxus 0.8 alpha — pinned/locked)
        # apps/parent is on dioxus 0.8.0-alpha.0; the CLI must be installed with
        # --locked (the library builds with plain cargo). Mirrors CLAUDE.md.
        run: cargo install dioxus-cli --version 0.8.0-alpha.0 --locked

      - name: Export NDK cross-compiler env for aarch64 (ring needs cc)
        # The Rust dep tree (ring, via tonic's tls-ring) compiles C for the
        # target, so point the linker/CC/AR at the NDK arm64 toolchain — the
        # exact set CLAUDE.md calls out for a `dx build --platform android`.
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android34-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android34-clang" >> "$GITHUB_ENV"

      - name: Signing-secret presence notice
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::notice title=Unsigned Manager APK::No ANDROID_KEYSTORE_BASE64 secret — shipping the UNSIGNED dx APK. Add the four ANDROID_* secrets to ship a signed Manager APK (docs/distribution.md)."
          else
            echo "::notice title=Signed Manager APK::Release keystore present — the Manager APK will be zipalign+apksigner signed."
          fi

      - name: Bundle the Manager APK (arm64, release) with dx
        working-directory: apps/parent
        # --target pins arm64 (no --device in CI; see job header). --package-types
        # apk forces an .apk (the FOSS channels take APKs, not an .aab). dx emits
        # an UNSIGNED release APK under target/dx/.../android/.../outputs/apk/release.
        run: dx bundle --platform android --release --package-types apk --target aarch64-linux-android

      - name: Locate, (optionally) sign, and stage manager-release.apk
        working-directory: apps/parent
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # dx names the dir from the build profile; find the freshest release APK
          # it produced (unsigned or already-aligned), excluding any debug output.
          RAW="$(find target/dx -path '*outputs/apk/release/*.apk' | head -n1)"
          if [ -z "$RAW" ]; then
            echo "::error title=Manager APK missing::dx produced no release APK under target/dx/**/outputs/apk/release"
            exit 1
          fi
          echo "dx APK: $RAW"

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            # No keystore -> ship the UNSIGNED dx APK under the stable name.
            cp "$RAW" dist/manager-release.apk
          else
            BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            "$BT/zipalign" -p -f 4 "$RAW" manager-aligned.apk
            "$BT/apksigner" sign \
              --ks release.keystore \
              --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --key-pass "pass:$ANDROID_KEY_PASSWORD" \
              --out dist/manager-release.apk \
              manager-aligned.apk
            "$BT/apksigner" verify --print-certs dist/manager-release.apk
            rm -f release.keystore manager-aligned.apk
          fi
          (cd dist && sha256sum manager-release.apk > SHA256SUMS-manager-foss)
          ls -la dist/

      - name: Attach to the GitHub Release (tag push or published release)
        if: github.event_name == 'release' || github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: apps/parent/dist/*

      - name: Upload as a workflow artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: ph-bulwark-manager-foss-release-apk
          path: apps/parent/dist/*
          if-no-files-found: error
