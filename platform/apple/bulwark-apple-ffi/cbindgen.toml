# cbindgen configuration for bulwark-apple-ffi.
#
# Regenerate the C header on a Mac (or anywhere cbindgen is installed) with:
#
#     cargo install cbindgen
#     cbindgen --config cbindgen.toml --crate bulwark-apple-ffi \
#              --output include/bulwark_apple.h
#
# The checked-in include/bulwark_apple.h is kept byte-for-byte consistent with the
# #[no_mangle] exports in src/ffi.rs; if you change the ABI, regenerate it (or
# hand-edit to match) and update the Swift bridging header.

language = "C"
pragma_once = true
include_guard = "BULWARK_APPLE_H"
autogen_warning = "/* Generated by cbindgen from bulwark-apple-ffi. Do not edit by hand unless kept in sync with src/ffi.rs. */"
documentation = true
documentation_style = "doxy"
style = "type"
cpp_compat = true

[parse]
parse_deps = false

# Only export the FFI surface (the opaque engine type is emitted as an opaque
# struct; the action/category enums are emitted as C enums).
[export]
include = ["BulwarkEngine", "AppleAction", "AppleCategory"]
prefix = "Bulwark"

[export.rename]
"AppleAction" = "BulwarkAppleAction"
"AppleCategory" = "BulwarkAppleCategory"

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[fn]
prefix = ""

[defines]
