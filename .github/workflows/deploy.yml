name: deploy

# Build the PH Bulwark server image in CI (where there's RAM for the ORT/release
# build), push it to GHCR, then have the EC2 instance docker-PULL + run it via AWS
# SSM. The instance NEVER builds — so the small (t3.small / 2 GB) box can't OOM on
# the heavy onnx build; it only runs the prebuilt image (~0.5 GB at runtime).
#
# Gated on the GitHub Environment `production`. Required secrets/vars:
#   secret AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  scoped deploy IAM user
#                                                     (ph-bulwark-deployer; ssm:SendCommand)
#   var    AWS_REGION        e.g. eu-west-2
#   var    AWS_INSTANCE_ID   the EC2 instance id (SSM-managed)
#   var    BULWARK_PORT        optional, default 8443
# The instance needs SSM (AmazonSSMManagedInstanceCore) + outbound HTTPS to ghcr.io.

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch: {}

concurrency:
  group: deploy-server
  cancel-in-progress: true

env:
  # GHCR image, lowercase (GHCR requires it). Built with FEATURES=onnx so it carries
  # real image scoring + the bundled NSFW model; the instance just runs it.
  IMAGE: ghcr.io/jordan-hall/bulwark-server

jobs:
  build-image:
    name: build + push onnx server image (CI has the RAM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (FEATURES=onnx, embeds the bundled NSFW model)
        run: |
          set -euo pipefail
          docker build --build-arg FEATURES=onnx,whisper -f deploy/docker/Dockerfile \
            -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" .
      - name: Smoke test — server boots + loads the ONNX model (.so dlopens)
        run: |
          set -euo pipefail
          docker run -d --name smoke -e BULWARK_ACCOUNTS=1 "$IMAGE:${GITHUB_SHA}" --role all-in-one
          sleep 12
          if [ "$(docker inspect -f '{{.State.Running}}' smoke 2>/dev/null)" != "true" ]; then
            echo "::error::server did not stay up — ONNX runtime .so missing or model load failed"
            docker logs smoke || true; docker rm -f smoke || true; exit 1
          fi
          echo "server is up; recent logs:"; docker logs smoke 2>&1 | tail -15
          docker rm -f smoke
      - name: Push to GHCR (only a booting image is published)
        run: |
          set -euo pipefail
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

  deploy-server:
    name: redeploy server via SSM (pull, no build, no SSH)
    needs: build-image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Configure AWS credentials (scoped deploy user)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Redeploy via SSM Run Command (docker pull the prebuilt image)
        env:
          IID: ${{ vars.AWS_INSTANCE_ID }}
          BULWARK_PORT: ${{ vars.BULWARK_PORT }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PORT="${BULWARK_PORT:-8443}"
          REF="${IMAGE}:${GITHUB_SHA}"
          # `set -eu` (NOT -eux) on the instance so the GHCR token isn't echoed into
          # the SSM command log. The login cred is removed again with `docker logout`.
          cat > params.json <<JSON
          {"commands":[
            "set -eu",
            "df -h / || true",
            "docker system prune -af || true",
            "docker rm -f aegis-server || true",
            "mkdir -p /var/lib/bulwark",
            "[ -d /var/lib/aegis ] && cp -an /var/lib/aegis/. /var/lib/bulwark/ 2>/dev/null || true",
            "echo '${GHCR_TOKEN}' | docker login ghcr.io -u '${GHCR_USER}' --password-stdin",
            "docker pull '${REF}'",
            "docker rm -f bulwark-server || true",
            "docker run -d --name bulwark-server --restart unless-stopped -p ${PORT}:${PORT} -v /var/lib/bulwark:/var/lib/bulwark -e BULWARK_BIND=0.0.0.0:${PORT} -e BULWARK_ACCOUNTS=1 -e BULWARK_STATE_DIR=/var/lib/bulwark '${REF}' --role all-in-one",
            "docker logout ghcr.io || true",
            "docker image prune -f || true"
          ]}
          JSON
          CID=$(aws ssm send-command --instance-ids "$IID" \
            --document-name AWS-RunShellScript --comment "PH Bulwark redeploy (pull)" \
            --parameters file://params.json --query Command.CommandId --output text)
          echo "SSM command: $CID"
          for i in $(seq 1 60); do
            ST=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $ST"
            case "$ST" in
              Success) break;;
              Failed|Cancelled|TimedOut)
                echo "::error::SSM redeploy $ST"
                aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardErrorContent --output text
                exit 1;;
            esac
            sleep 10
          done
          echo "=== server output ==="
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardOutputContent --output text
