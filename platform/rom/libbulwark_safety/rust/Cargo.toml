# Rust core for the Child Safety ROM's NSFW safety gate, exposed as the C ABI in
# ../include/bulwark_safety.h (cbindgen-compatible) that bulwarkd + the camera-gate
# hook link. DETACHED workspace (mirrors platform/android/rust/bulwark-android, which
# already cross-compiles Rust to Android via cargo-ndk).
#
# Reuses crates/bulwark-vision's scorer so detection NEVER drifts from the shipping
# engine. The `onnx` feature pulls the real `ort` scorer. VERIFIED building for
# aarch64-linux-android via cargo-ndk (2026-06-20): `ort`'s `download-binaries` fetches
# pyke's prebuilt onnxruntime (ms@1.24.2, aarch64-linux-android) and links it
# `static=onnxruntime` — so it is STATICALLY baked into libbulwark_safety (NOT a separate
# libonnxruntime.so, and NOT the camera app's AAR-bundled runtime). The only external
# shared dep is `libc++_shared`, which AOSP provides system-wide. WITHOUT `onnx` (the
# default — what builds on the dev host), every score FAILS CLOSED, so the crate + its
# ABI compile + verify here while the real model path is CI/Android.
[package]
name = "bulwark-rom-safety"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "bulwark_safety"
crate-type = ["staticlib", "cdylib"]

[dependencies]
# Only pulled in (with its onnx scorer) under the `onnx` feature; the default host
# build is self-contained (fails closed) so it compiles without onnxruntime.
bulwark-vision = { path = "../../../../crates/bulwark-vision", default-features = false, optional = true }
# Text/grooming path: the rules-first detector (no ONNX) — builds on any host, so the
# text ABI is verified locally. proto for TextSpan / Action.
bulwark-text = { path = "../../../../crates/bulwark-text" }
bulwark-proto = { path = "../../../../crates/bulwark-proto" }
image = "0.25"
log = "0.4"

[features]
default = []
onnx = ["dep:bulwark-vision", "bulwark-vision/onnx"]

# Detached from the engine workspace, like platform/android/rust/bulwark-android.
[workspace]
