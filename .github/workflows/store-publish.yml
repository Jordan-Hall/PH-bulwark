name: store-publish

# Submit PREVIEW/test builds to app stores on a published Release (or manual run).
# Inert until you add the store account + secrets (a missing secret just fails the
# job — it never runs on normal pushes). Currently wired:
#   Android -> Google Play INTERNAL testing track (signed .aab).
# NOT wired (deliberately, no stubs):
#   MS Store -> needs MSIX packaging + a Partner Center app (separate piece).
#   iOS/TestFlight -> there is no iOS app yet.
#
# Required on the GitHub Environment `store`:
#   secret ANDROID_KEYSTORE_BASE64        base64 of your release keystore
#   secret ANDROID_KEYSTORE_PASSWORD
#   secret ANDROID_KEY_ALIAS
#   secret ANDROID_KEY_PASSWORD
#   secret PLAY_SERVICE_ACCOUNT_JSON      Play Console service-account JSON (plaintext)

on:
  release:
    types: [published]
  workflow_dispatch: {}

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  android-play-internal:
    name: Android → Play (internal testing)
    runs-on: ubuntu-latest
    environment: store
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4
      - name: Install NDK + export its path
        run: |
          sdkmanager "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - name: Set up Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build JNI lib (release) into jniLibs
        working-directory: platform/android/rust/bulwark-android
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -o ../../app/src/main/jniLibs build --release
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build signed release AAB
        working-directory: platform/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon --stacktrace
      - name: Upload to Play internal track (draft)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: co.predatorhunters.bulwark
          releaseFiles: platform/android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: draft
