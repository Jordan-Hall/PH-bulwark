[package]
name = "bulwark-audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bulwark-proto = { path = "../bulwark-proto" }
bulwark-core = { path = "../bulwark-core" }
# Audio is judged by TRANSCRIBING speech and running the transcript through the
# proven grooming/adult-text engine (lighter than a dedicated audio-NSFW model).
bulwark-text = { path = "../bulwark-text" }
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
ring.workspace = true
# whisper STT (open-source, MIT) behind the `whisper` feature: whisper.cpp via
# whisper-rs; `hound` reads the 16 kHz-mono WAV the demuxer/client provides.
anyhow = { workspace = true, optional = true }
whisper-rs = { version = "0.13", optional = true }
hound = { version = "3", optional = true }

[features]
default = []
# Real STT supplying a Transcriber (transcribe → bulwark-text). The ggml model is
# provisioned at BULWARK_WHISPER_MODEL; until then the analyzer fail-CLOSES.
whisper = ["dep:whisper-rs", "dep:hound", "dep:anyhow"]
