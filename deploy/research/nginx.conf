# nginx vhost for the Predator Hunters Research static site (Dioxus web/wasm).
# Single-page app: every unknown path falls back to index.html so client-side
# routing (/research, /approach, /about, /contact) works on a hard refresh.
#
# TLS is terminated at the Cloudflare edge (the subdomain is proxied), so this
# origin speaks plain HTTP on :80 inside the container; the deploy maps it to a
# Cloudflare-allowed host port.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # wasm must be served with the correct type for streaming instantiation.
    types {
        application/wasm wasm;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the immutable, content-hashed bundle assets.
    location ~* \.(wasm|js|css|woff2?|jpg|jpeg|png|svg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # index.html itself must never be cached, so a deploy is picked up at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
