# bulwark-android — JNI bridge for `co.predatorhunters.bulwark.core.RustBridge`.
#
# The Android build supports two explicit VPN modes:
#   * Local VPN  — TLS inspection + policy on the device.
#   * Remote VPN — transport-only WireGuard on the device; the region filters.

[package]
name = "bulwark-android"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "JNI bridge: Android app -> Bulwark content-safety core."

[lib]
name = "bulwark_client"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
bulwark-text = { path = "../../../../crates/bulwark-text" }
bulwark-policy = { path = "../../../../crates/bulwark-policy" }
bulwark-core = { path = "../../../../crates/bulwark-core" }
bulwark-proto = { path = "../../../../crates/bulwark-proto" }
bulwark-net = { path = "../../../../crates/bulwark-net" }
serde_json = "1"
tracing = { version = "0.1", features = ["log"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tonic = { version = "0.14", features = ["transport", "tls-ring", "tls-webpki-roots"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13"
log = "0.4"
bulwark-net = { path = "../../../../crates/bulwark-net", features = ["wg-client"] }
boringtun = "0.7"
data-encoding = "2"
libc = "0.2"
rand_core = { version = "0.6.4", features = ["getrandom"] }

[dev-dependencies]
async-trait = "0.1"

[workspace]
