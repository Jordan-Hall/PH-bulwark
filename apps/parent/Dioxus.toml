# PH Bulwark Manager — Dioxus 0.8 bundle/mobile config (mirrors apps/child's).
#
# WHY THIS FILE EXISTS: without a Dioxus.toml, dx ships its DEFAULT
# AndroidManifest (a com.example package, no INTERNET permission) — the console
# couldn't even dial the cluster. The distinct `.manager` identifier lets the
# guardian console coexist with the child app (co.predatorhunters.bulwark) on
# the same device.
#
# NATIVE UNIFIEDPUSH RECEIVE (issue #151): dx 0.8.0-alpha exposes two committed-
# source seams we use here (verified against dioxus-cli-0.8.0-alpha.0 source):
#   * `[application].android_manifest`     → dx uses our AndroidManifest.xml
#                                             VERBATIM (src/build/android.rs:264).
#   * `[application].android_main_activity` → dx writes our MainActivity.kt
#                                             VERBATIM into dev.dioxus.main and
#                                             compiles it (android.rs:279). A Kotlin
#                                             file may hold several top-level
#                                             classes, so the UnifiedPush
#                                             `PushService` rides along in it.
#   * `[android].gradle_dependencies`       → rendered into the app's
#                                             `dependencies {}` block
#                                             (build.gradle.kts.hbs) — the FOSS
#                                             Apache-2.0 UnifiedPush connector.

[application]
name = "PH Bulwark Manager"
# Custom Android shell so the UnifiedPush PushService + its manifest <service>
# ship as committed source dx regenerates on every build (see header).
android_manifest = "android/AndroidManifest.xml"
android_main_activity = "android/MainActivity.kt"

[bundle]
identifier = "co.predatorhunters.bulwark.manager"
# PH Bulwark shield icon (apps/parent/assets/icon.png, 1024² navy+shield, matching
# the child/camera launcher icons). HONEST SCOPE: dx 0.8.0-alpha consumes
# `[bundle].icon` ONLY in the DESKTOP bundlers (macOS/Linux/Windows) — its Android
# build (dioxus-cli src/build/android.rs) hardcodes the launcher icon via
# include_bytes! and reads NO icon config (the `[android].icon` schema field exists
# but is unwired). So this sets the DESKTOP Manager icon (and future-proofs Android
# if dx ever wires it); the ANDROID launcher icon is overlaid post-gen by
# `build-android.ps1` from `android/res/` (the recommended fallback). Keep the two
# in visual sync.
icon = ["assets/icon.png"]

[android]
identifier = "co.predatorhunters.bulwark.manager"
min_sdk = 26
target_sdk = 34
# FOSS (Apache-2.0) UnifiedPush Android connector — no Google/Apple services. The
# 3.x line delivers via a bound PushService (the old MessagingReceiver is
# deprecated upstream); the AAR's own manifest contributes the package-visibility
# <queries> + the embedded receiver, merged by AGP at build. Bare coordinate: the
# build.gradle.kts template wraps it in `implementation("…")`.
gradle_dependencies = ["org.unifiedpush.android:connector:3.0.10"]

[android.permissions]
"android.permission.INTERNET" = { description = "Connect to your PH Bulwark server to review alerts and pair your child's device" }
"android.permission.POST_NOTIFICATIONS" = { description = "Show redacted, content-free child-safety alerts on this device" }
