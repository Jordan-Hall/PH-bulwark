# Build the Aegis CHILD Android APK (VpnService filter + enrollment).
#
# The dev host has no full Android toolchain, so APKs build here on a Linux
# runner. Flow: build the Rust JNI lib (libaegis_client.so) for both ABIs with
# cargo-ndk into the app's jniLibs, then assemble the debug APK with Gradle and
# upload it as an artifact.
#
# NOTE: the parent/"adult" app is Dioxus-mobile (experimental) and is a
# documented follow-up — this workflow focuses on the child VpnService APK.
name: android

on:
  push:
    paths:
      - "platform/android/**"
      - "crates/**"
      # the root crates resolve workspace dep versions/features from the root
      # manifest+lockfile, so a change there can break the JNI/APK build too.
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "platform/android/**"
      # aegis-android depends on the root crates via ../../../../crates/...,
      # so a PR that only touches a crate (aegis-text/policy/core/proto) — or the
      # root manifest/lockfile those crates inherit workspace deps from — can
      # break the JNI/APK build; mirror the push filter to catch it pre-merge.
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

jobs:
  child-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + export its path
        run: |
          sdkmanager "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
          # setup-android sets ANDROID_SDK_ROOT but NOT ANDROID_NDK_ROOT, so
          # cargo-ndk would see an empty NDK path. Pin the concrete NDK dir for
          # all subsequent steps.
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Set up Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platform/android/rust/aegis-android/target
          key: ${{ runner.os }}-cargo-ndk-${{ hashFiles('platform/android/rust/aegis-android/Cargo.lock') }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build JNI lib (arm64-v8a + armeabi-v7a) into jniLibs
        working-directory: platform/android/rust/aegis-android
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -o ../../app/src/main/jniLibs \
            build --release

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        working-directory: platform/android
        # setup-gradle provides `gradle`; no committed gradle-wrapper.jar needed.
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload child debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aegis-child-debug-apk
          path: platform/android/app/build/outputs/apk/**/*-debug.apk
          if-no-files-found: error
