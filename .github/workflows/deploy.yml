name: deploy

# Redeploy / update a running PH Bulwark server from CI WITHOUT inbound SSH:
# GitHub calls AWS SSM Run Command, and the SSM agent on the instance runs the
# redeploy (git pull -> rebuild image -> restart). The EC2 keeps its SSH port
# locked to the operator's IP; CI never connects to it directly.
#
# Gated on the GitHub Environment named `production`. Required secrets/vars:
#   secret AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  the SCOPED deploy IAM user
#                                                     (ph-bulwark-deployer; ssm:SendCommand)
#   var    AWS_REGION        e.g. eu-west-2
#   var    AWS_INSTANCE_ID   the EC2 instance id (must have the ph-bulwark-ssm role)
#   var    AEGIS_PORT        optional, default 8443 (must match the server's port)
#
# The instance needs an SSM instance profile (AmazonSSMManagedInstanceCore) — a
# one-time setup, see docs/release.md §5. Triggers: published Release or manual run.

on:
  # TESTING PHASE: continuously deploy every merge to master to the London server,
  # alongside the rolling pre-release (prerelease.yml). Switch to release-only
  # (drop the push trigger) once we cut production releases.
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch: {}

concurrency:
  group: deploy-server
  cancel-in-progress: true

jobs:
  deploy-server:
    name: redeploy server via SSM (no SSH)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials (scoped deploy user)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Redeploy via SSM Run Command
        env:
          IID: ${{ vars.AWS_INSTANCE_ID }}
          AEGIS_PORT: ${{ vars.AEGIS_PORT }}
        run: |
          set -euo pipefail
          PORT="${AEGIS_PORT:-8443}"
          # One command per array element. SSM runs these as root on the instance.
          cat > params.json <<JSON
          {"commands":[
            "set -eux",
            "cd /opt/aegis-src",
            "git pull --ff-only",
            "df -h / || true",
            "docker system prune -af || true",
            "df -h / || true",
            "docker build --build-arg FEATURES=onnx -f deploy/docker/Dockerfile -t aegis-server:local .",
            "docker rm -f aegis-server || true",
            "docker run -d --name aegis-server --restart unless-stopped -p ${PORT}:${PORT} -v /var/lib/aegis:/var/lib/aegis -e AEGIS_BIND=0.0.0.0:${PORT} -e AEGIS_ACCOUNTS=1 -e AEGIS_STATE_DIR=/var/lib/aegis aegis-server:local --role all-in-one"
          ]}
          JSON
          CID=$(aws ssm send-command --instance-ids "$IID" \
            --document-name AWS-RunShellScript --comment "PH Bulwark redeploy" \
            --parameters file://params.json --query Command.CommandId --output text)
          echo "SSM command: $CID"
          for i in $(seq 1 90); do
            ST=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $ST"
            case "$ST" in
              Success) break;;
              Failed|Cancelled|TimedOut)
                echo "::error::SSM redeploy $ST"
                aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardErrorContent --output text
                exit 1;;
            esac
            sleep 10
          done
          echo "=== server output ==="
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardOutputContent --output text
