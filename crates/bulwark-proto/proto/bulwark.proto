// Bulwark gRPC/protobuf contracts — the single source of truth shared by
// client, server, and cluster nodes so they can never drift.
//
// Transport: tonic gRPC over HTTP/2 with **mTLS** on every link
// (client⇄cluster and worker⇄worker). See docs/design/architecture.md.
//
// PRIVACY / SAFETY INVARIANTS (enforced by message shape, not just policy):
//   * Raw explicit media is NEVER carried back in a Verdict or AlertEvent.
//     `Evidence` deliberately carries ONLY hashes, a SAFE (blurred/cropped)
//     thumbnail, or a redacted text snippet — never the original frame/clip.
//   * Suspected CSAM is flagged, never archived: see Category.CSAM_SUSPECTED
//     and the report-never-store rule in PLAN.md §0c.
//   * Inline media on AnalysisRequest is transient (analysed in memory,
//     never persisted by a worker). Prefer MediaRef where a side channel
//     already holds the bytes.

syntax = "proto3";

package bulwark.v1;

// ---------------------------------------------------------------------------
// Enums
// ---------------------------------------------------------------------------

// What kind of payload a request carries. Drives which analyzer pipeline runs.
enum MediaKind {
  MEDIA_KIND_UNSPECIFIED = 0;
  MEDIA_KIND_TEXT        = 1; // chat / page text / OCR'd on-screen text
  MEDIA_KIND_IMAGE       = 2; // a still image or sampled video frame
  MEDIA_KIND_AUDIO       = 3; // an audio segment (PCM/encoded)
  MEDIA_KIND_VIDEO       = 4; // a buffered video segment (decoded by worker)
}

// Where the captured content originated. Lets policy treat a buffered VOD
// stream differently from a live stream or an on-device OCR capture.
enum SourceChannel {
  SOURCE_CHANNEL_UNSPECIFIED = 0;
  WEB                        = 1; // MITM'd HTTP(S) page / web chat
  VIDEO_STREAM               = 2; // progressive / HLS / DASH (buffered, delay OK)
  LIVE_STREAM                = 3; // low-latency live (bounded delay budget)
  OCR_ONSCREEN               = 4; // on-device conventional OCR (E2E / pinned apps)
  NOTIFICATION               = 5; // on-device notification text (E2E apps)
}

// Classifier verdict category. SAFE is the explicit negative class so a
// Verdict is always conclusive. GROOMING/CSAM_SUSPECTED come from bulwark-text
// rules+classifier; the ADULT_* come from vision/audio/text analyzers.
enum Category {
  CATEGORY_UNSPECIFIED = 0;
  SAFE                 = 1;
  ADULT_IMAGE          = 2;
  ADULT_AUDIO          = 3;
  ADULT_TEXT           = 4;
  GROOMING             = 5;
  CSAM_SUSPECTED       = 6; // report-never-archive path (PLAN §0c)
  VIOLENCE             = 7;
  SELF_HARM            = 8;
  HATE                 = 9;
}

// Severity bands. Map onto policy thresholds (see model-research §grooming).
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  INFO                 = 1; // log-only, <0.3 score band
  LOW                  = 2; // log, 0.3–0.5
  MEDIUM               = 3; // flag + log, 0.5–0.7
  HIGH                 = 4; // immediate alert + human review, ≥0.7
  CRITICAL             = 5; // CSAM-suspected / safety-critical, escalate now
}

// Action the client should take on the flow/segment. Set by bulwark-policy from
// a Verdict; carried back so the data plane needs no second round trip.
enum Action {
  ACTION_UNSPECIFIED = 0;
  ALLOW              = 1; // forward unchanged
  BLOCK              = 2; // drop / reset the flow or segment
  BLUR               = 3; // re-encode flagged region/frame blurred (video/image)
  MUTE               = 4; // silence flagged audio span
  WARN               = 5; // forward but show an interstitial / overlay
  LOG                = 6; // forward, record for review (borderline)
}

// ONNX execution provider a worker (or local client) used / can use. Mirrors
// `ort` provider names; lets bulwark-infer route by capability and reproduce.
enum ExecutionProvider {
  EXECUTION_PROVIDER_UNSPECIFIED = 0;
  CPU                            = 1; // CPU / oneDNN baseline (always available)
  CUDA                           = 2;
  TENSORRT                       = 3;
  DIRECTML                       = 4; // Windows GPU
  COREML                         = 5; // Apple
  NNAPI                          = 6; // Android
  QNN                            = 7; // Qualcomm
}

// ---------------------------------------------------------------------------
// Common payload messages
// ---------------------------------------------------------------------------

// Inline bytes for analysis. TRANSIENT: analysed in memory, never persisted.
// Keep small; for anything large prefer MediaRef + a side channel.
message InlineMedia {
  bytes  data      = 1; // raw bytes (image/audio/video segment)
  string mime_type = 2; // e.g. "image/jpeg", "audio/L16", "video/mp4"
  uint32 width     = 3; // optional, images/frames
  uint32 height    = 4; // optional, images/frames
  uint64 duration_ms = 5; // optional, audio/video
}

// Reference to media already held by a content-addressed side channel (e.g. a
// worker-local blob cache keyed by hash) so we don't re-ship large payloads.
message MediaRef {
  string uri    = 1; // opaque, cluster-internal (e.g. "blob://<sha256>")
  bytes  sha256 = 2; // content hash; worker rejects on mismatch
  uint64 size   = 3; // bytes
  string mime_type = 4;
}

// A span of text to classify. Carries enough context for the conversation-level
// grooming state machine without shipping whole histories.
message TextSpan {
  string text        = 1; // the message / OCR'd text (already plaintext)
  string lang        = 2; // BCP-47 hint ("en", "es"); empty = detect
  string app         = 3; // originating app/site ("messenger", "example.com")
  string thread_id   = 4; // stable per-conversation id for state correlation
  bool   from_minor  = 5; // true if the supervised child authored it (if known)
  repeated string prior_excerpts = 6; // short redacted context for state machine
}

// ---------------------------------------------------------------------------
// Analysis service
// ---------------------------------------------------------------------------

// One unit of work submitted by a client to the cluster.
message AnalysisRequest {
  string        request_id    = 1; // client-generated idempotency key
  MediaKind     media_kind    = 2;
  SourceChannel source_channel = 3;
  string        device_id     = 4; // supervised device (client cert subject)
  int64         ts            = 5; // capture time, unix epoch millis
  TextSpan      text_span     = 6; // present when media_kind == TEXT

  // Exactly one of the media carriers (for non-text kinds).
  oneof media {
    InlineMedia inline_media = 7;
    MediaRef    media_ref    = 8;
  }

  // Soft deadline so a worker can fast-path / shed under a live-stream budget.
  uint32 deadline_ms = 9;
}

// Hash-only / safe evidence attached to a Verdict for the review UI and alerts.
// INVARIANT: NO raw explicit media here — hashes, a SAFE thumbnail (blurred or
// heavily cropped), or a redacted text snippet ONLY. Never the original frame,
// clip, or unredacted message. CSAM is reported via legal channels, not stored.
message Evidence {
  bytes  sha256          = 1; // content hash of the analysed media
  bytes  perceptual_hash = 2; // pHash for near-dup / known-hash matching
  bytes  safe_thumbnail  = 3; // OPTIONAL blurred/cropped preview — SAFE only
  string text_snippet    = 4; // OPTIONAL redacted excerpt (text verdicts only)
  string model_id        = 5; // which model produced the verdict (auditable)
  string model_version   = 6;
}

// The decision returned for an AnalysisRequest.
message Verdict {
  string   request_id = 1; // echoes AnalysisRequest.request_id
  Category category    = 2;
  Action   action      = 3; // recommended action (policy may override)
  Severity severity    = 4;
  float    score       = 5; // normalized confidence 0.0–1.0
  string   rationale    = 6; // human-readable, explainable (rules cite triggers)
  Evidence evidence     = 7;
  GroomingSignal grooming = 8; // present when category == GROOMING / CSAM_SUSPECTED
  string   worker_id    = 9; // which node served it (observability)
  uint32   latency_ms   = 10; // server-side processing time
  // LOCAL-ONLY `blob://<sha256>` ref to a blocked/borderline VIDEO segment the
  // analyzer retained for guardian review (bulwark-video::SegmentStore). Copied into
  // AlertEvent.local_segment_uri. Empty for non-video / benign / CSAM (never stored).
  string   local_segment_uri = 11;
}

// Output of the deterministic grooming rule engine (model-research §grooming).
// The eight indicator categories are explainable and auditable.
message GroomingSignal {
  // Which of the eight rule categories fired, by stable name:
  // "secrecy", "platform_switching", "personal_info_age_probing",
  // "sexualization", "gifts_bribery", "emotional_manipulation",
  // "boundary_testing", "image_request".
  repeated string fired_categories = 1;
  float  score   = 2; // normalized 0.0–1.0 (rule sum + context multipliers)
  string excerpt = 3; // redacted excerpt that triggered the signal
  bool   classifier_backed = 4; // true if small text classifier agreed
}

// Batched analysis (e.g. several sampled frames from one video segment).
message AnalysisBatch {
  repeated AnalysisRequest requests = 1;
}

message VerdictBatch {
  repeated Verdict verdicts = 1;
}

// Client → cluster heavy analysis. Workers are stateless; any node can serve.
service Analysis {
  // Single request → single verdict (web text, one image).
  rpc Analyze(AnalysisRequest) returns (Verdict);
  // Bidirectional stream for live/continuous capture (frames, audio chunks).
  rpc AnalyzeStream(stream AnalysisRequest) returns (stream Verdict);
  // Batched fan-out (sampled frames of a buffered video segment).
  rpc AnalyzeBatch(AnalysisBatch) returns (VerdictBatch);
}

// ---------------------------------------------------------------------------
// Offload service — device-capability negotiation (bulwark-infer ⇄ cluster)
// ---------------------------------------------------------------------------

// What the device can do locally. Drives the local-vs-remote routing decision.
message DeviceProfile {
  string device_id = 1;
  string platform  = 2; // "windows", "linux", "android", "macos"
  string cpu       = 3; // model string / arch
  uint32 cpu_cores = 4;
  uint64 ram_mb    = 5;
  string gpu       = 6; // GPU model string, empty if none
  repeated ExecutionProvider exec_providers = 7; // available, best-first
  int32  battery_pct = 8;   // -1 if on mains / unknown
  bool   on_battery  = 9;
  uint32 rtt_ms      = 10;  // measured RTT to the cluster gateway
  string app_version = 11;
}

// How work should be split between device and cluster. Returned by the cluster
// from a DeviceProfile; the client honours it until RefreshOffload.
message OffloadPolicy {
  // Per-MediaKind routing hint. true = run locally, false = offload to cluster.
  bool run_text_local   = 1; // grooming rules are cheap → usually local
  bool run_image_local  = 2;
  bool run_audio_local  = 3;
  bool run_video_local  = 4; // almost always false on mobile

  // Thresholds the client applies before offloading anyway.
  uint32 max_local_rtt_ms     = 5; // offload preferred above this RTT
  uint32 min_battery_pct      = 6; // below this, force-offload heavy work
  uint32 cluster_queue_backpressure = 7; // est. queue depth → prefer local
  uint32 ttl_secs             = 8; // re-negotiate after this
  repeated ExecutionProvider preferred_local_providers = 9; // best-first to try
  string policy_id            = 10; // for audit / RefreshOffload correlation
}

message RefreshOffloadRequest {
  string device_id = 1;
  string policy_id = 2; // current policy held by the client
  uint32 rtt_ms    = 3; // fresh measurement
  int32  battery_pct = 4;
}

service Offload {
  rpc NegotiateOffload(DeviceProfile) returns (OffloadPolicy);
  rpc RefreshOffload(RefreshOffloadRequest) returns (OffloadPolicy);
}

// ---------------------------------------------------------------------------
// AlertRelay service — guardian notifications (client/server → bulwark-alert)
// ---------------------------------------------------------------------------

// Why an alert fired. Two product triggers per PLAN §0/§2.
enum AlertKind {
  ALERT_KIND_UNSPECIFIED = 0;
  INTERVENTION           = 1; // a blocker acted (block/blur/mute)
  GROOMING_SUSPECTED     = 2; // grooming engine crossed alert threshold
  PROTECTION_DISABLED    = 3; // tamper: filtering/admin/accessibility off, app-removal attempt, or missed heartbeat
}

// A guardian-facing alert. Carries redacted context ONLY — never explicit media.
message AlertEvent {
  string    alert_id = 1; // idempotency key (dedupe across retries)
  AlertKind kind     = 2;
  Category  category  = 3;
  Severity  severity  = 4;
  string    app       = 5; // app/site involved
  string    device_id = 6;
  int64     ts        = 7; // unix epoch millis
  string    redacted_context = 8; // safe summary / redacted excerpt — NO media
  Evidence  evidence  = 9; // hashes / safe thumbnail only (see Evidence invariant)
  // Per-child routing (Accounts service): which supervised child this alert is
  // about, so the relay fans it out ONLY to that child's assigned guardian(s).
  // Empty = legacy device-only routing (every guardian stream sees it).
  string    child_id  = 10;
  string    family_id = 11; // the family the child belongs to (audit / scoping)

  // LOCAL-ONLY content-addressed reference (`blob://<sha256-hex>`) to a
  // blocked/borderline VIDEO segment retained on the GUARDIAN's node for review
  // (bulwark-video::SegmentStore). The parent app loads it from local storage; it
  // is NEVER raw bytes and NEVER carries suspected CSAM (always empty for
  // CSAM_SUSPECTED — the store refuses to persist it). Empty when no clip.
  string    local_segment_uri = 12;
}

message AlertAck {
  string alert_id  = 1;
  bool   delivered = 2; // accepted by the relay (queued for email)
  bool   deduped   = 3; // suppressed by rate-limit/digest
  string detail    = 4;
}

message AlertBatch {
  repeated AlertEvent events = 1;
}

message AlertAckBatch {
  repeated AlertAck acks = 1;
}

service AlertRelay {
  rpc RaiseAlert(AlertEvent) returns (AlertAck);
  rpc RaiseAlerts(AlertBatch) returns (AlertAckBatch); // digest / backfill
}

// ---------------------------------------------------------------------------
// Review service — guardian approve/deny (notification + Review screen →
// bulwark-policy / bulwark-alert). See docs/design/parent-notifications.md.
// APPROVE allowlists the host / content hash for this child; DENY confirms the
// block. Every decision is audited by bulwark-policy. RegisterPushTarget lets the
// cluster relay an alert via FCM to a guardian's separate device;
// StreamPendingReviews carries the SAME redacted AlertEvent (no media, ever).
// ---------------------------------------------------------------------------

// The guardian's verdict on a flagged item.
enum ReviewDecision {
  REVIEW_DECISION_UNSPECIFIED = 0;
  APPROVE                     = 1; // allow this item (allowlist host/hash)
  DENY                        = 2; // confirm the block
}

// Breadth of an APPROVE (mirrors bulwark-policy's host/content-hash allowlist).
enum ReviewScope {
  REVIEW_SCOPE_UNSPECIFIED = 0;
  THIS_ITEM                = 1; // only the exact content (by evidence hash)
  THIS_HOST                = 2; // the whole app/host involved
}

// One guardian decision on a previously-raised AlertEvent.
message ReviewRequest {
  string         alert_id  = 1; // the AlertEvent.alert_id being decided
  ReviewDecision decision  = 2;
  string         device_id = 3; // supervised device the alert came from
  ReviewScope    scope     = 4; // breadth of an APPROVE (ignored for DENY)
  int64          ts        = 5;
}

message ReviewAck {
  string alert_id = 1;
  bool   applied  = 2;
}

// A guardian device registered for remote push (FCM). Routing token only — no
// alert content.
message PushTarget {
  string device_id = 1; // the GUARDIAN device id
  string fcm_token  = 2; // FCM registration token (rotates)
  string platform   = 3; // "android" | "ios" | "web"
}

message PushAck {
  bool ok = 1;
}

message DeviceFilter {
  string device_id = 1; // empty = all supervised devices
  // Guardian session token (from Accounts.Login). When set, the pending-review
  // stream is scoped to the children this guardian is assigned to — an alert is
  // delivered only if its child_id is one of theirs. May also be supplied via the
  // `authorization: Bearer <token>` gRPC metadata header. Empty = legacy
  // device-only behaviour (no per-guardian scoping).
  string token = 2;
}

// Guardian approve/deny review + remote-push registration. The pending-review
// stream re-emits the redacted AlertEvent (same no-media invariant as AlertRelay).
service Review {
  rpc SubmitDecision(ReviewRequest) returns (ReviewAck);
  rpc RegisterPushTarget(PushTarget) returns (PushAck);
  rpc StreamPendingReviews(DeviceFilter) returns (stream AlertEvent);
  // Fetch a retained blocked/borderline VIDEO clip for review, streamed in chunks,
  // so a guardian on a DIFFERENT device than the server can play it (not just a
  // co-located parent reading blob:// off local disk). CSAM is never retained, so
  // it can never be fetched here.
  rpc FetchSegment(SegmentRequest) returns (stream SegmentChunk);
}

// Request to fetch a retained video segment by its blob:// URI
// (AlertEvent.local_segment_uri). `token` authenticates the guardian in accounts
// mode (may also be supplied via the authorization Bearer metadata header).
message SegmentRequest {
  string local_segment_uri = 1;
  string token = 2;
}

// One server-streamed chunk of segment bytes.
message SegmentChunk {
  bytes data = 1;
}

// ---------------------------------------------------------------------------
// Tamper service — child-device protection liveness + uninstall/disable alerts.
// The supervised child app sends periodic Heartbeats carrying its
// ProtectionStatus. A self-detected downgrade (accessibility/VPN/device-admin
// turned off, or an app-removal attempt) OR a MISSED heartbeat (app killed or
// uninstalled — detected server-side) raises a guardian
// AlertEvent(kind = PROTECTION_DISABLED). This is the cross-platform safety net:
// even where removal can't be PREVENTED, it is DETECTED and reported.
// Transparent + consented (managed child device); carries NO content, ever.
// ---------------------------------------------------------------------------

// What protection degraded (drives the PROTECTION_DISABLED alert text). No raw
// content — these are status signals only.
enum TamperKind {
  TAMPER_KIND_UNSPECIFIED    = 0;
  APP_UNINSTALL_ATTEMPT      = 1; // child opened the app's uninstall / app-info flow
  DEVICE_ADMIN_REMOVED       = 2; // device-admin / Device-Owner DPC deactivated
  ACCESSIBILITY_DISABLED     = 3; // capture / uninstall-guard accessibility turned off
  VPN_DISABLED               = 4; // filtering VPN / proxy stopped or bypassed
  HEARTBEAT_MISSED           = 5; // server-side: no heartbeat within the grace window
  SAFE_MODE_OR_FACTORY_RESET = 6; // safe-mode boot or factory-reset signal
}

// Snapshot of which protections are currently active on the child device.
message ProtectionStatus {
  string device_id           = 1;
  string child_id            = 2; // optional; resolved cluster-side from device_id if empty
  bool   vpn_active          = 3; // filtering VPN / proxy is up
  bool   device_admin_active = 4; // device-admin / DPC active
  bool   accessibility_active = 5; // capture / uninstall-guard service enabled
  bool   always_on_lockdown  = 6; // always-on VPN lockdown engaged (fail-closed)
  string platform            = 7; // "android" | "windows" | "macos" | ...
  string app_version         = 8;
  int64  ts                  = 9; // unix epoch millis
}

// Child → cluster liveness + protection report.
message Heartbeat {
  ProtectionStatus status = 1;
  // Tamper events observed locally since the last heartbeat (empty on a normal
  // liveness ping). Each becomes a PROTECTION_DISABLED guardian alert.
  repeated TamperKind tamper_events = 2;
}

message HeartbeatAck {
  uint32 next_interval_secs = 1; // server-tuned cadence (0 = keep current)
  bool   ok                 = 2;
}

service Tamper {
  // Periodic child liveness + protection status. A self-reported downgrade or a
  // missed heartbeat (detected server-side by the liveness sweeper) raises a
  // PROTECTION_DISABLED guardian alert via the same relay fan-out.
  rpc Heartbeat(Heartbeat) returns (HeartbeatAck);
}

// ---------------------------------------------------------------------------
// Accounts service — parent accounts + per-child assigned guardians.
//   * A PARENT ACCOUNT is an email + password (password is KDF-hashed at rest,
//     never stored plaintext — see bulwark-server::accounts).
//   * A CHILD belongs to a family; one or more guardian accounts are ASSIGNED to
//     each child. Alerts for a child route ONLY to that child's guardians
//     (AlertEvent.child_id → Review.StreamPendingReviews scoping by token).
//   * Mutating RPCs authenticate with the Session token from Login (also accepted
//     via `authorization: Bearer <token>` metadata).
// In-memory today (SEAM for durable storage); no raw content ever touches here.
// ---------------------------------------------------------------------------

message CreateAccountRequest {
  string email        = 1;
  string password     = 2; // hashed server-side (PBKDF2-HMAC-SHA256); never stored
  string display_name = 3;
}

message AccountAck {
  string account_id = 1;
  bool   created    = 2; // false if the email already exists
  string detail     = 3;
}

message LoginRequest {
  string email    = 1;
  string password = 2;
}

message Session {
  string token      = 1; // opaque bearer token for subsequent calls
  string account_id = 2;
  int64  issued_ts  = 3; // unix epoch millis
}

message AddChildRequest {
  string token      = 1; // caller's session; caller is auto-assigned as guardian
  string child_name = 2;
  string device_id  = 3; // the child's supervised device (links alerts → child)
}

// A supervised child + the guardian accounts assigned to them.
message Child {
  string child_id   = 1;
  string family_id  = 2;
  string child_name = 3;
  string device_id  = 4;
  repeated string guardian_account_ids = 5;
}

message AssignGuardianRequest {
  string token               = 1; // caller must already guard this child
  string child_id            = 2;
  string guardian_account_id = 3; // account to add as a guardian of the child
}

message GuardianAck {
  bool   ok     = 1;
  string detail = 2;
}

message ListChildrenRequest {
  string token = 1; // returns the children this guardian is assigned to
}

message Children {
  repeated Child children = 1;
}

// --- Pairing: parent generates a short code; the child device redeems it. ---
message CreatePairCodeRequest {
  string token      = 1; // parent session (also accepted via Bearer metadata)
  string child_name = 2;
}
message PairCode {
  string code       = 1; // short, human-typeable, single-use
  int64  expires_ts = 2; // unix epoch millis
}
message RedeemPairCodeRequest {
  string code      = 1;
  string device_id = 2; // the child device's stable id (links alerts → child)
}
message PairResult {
  string child_id  = 1;
  string family_id = 2;
}

service Accounts {
  rpc CreateAccount(CreateAccountRequest) returns (AccountAck);
  rpc Login(LoginRequest) returns (Session);
  rpc AddChild(AddChildRequest) returns (Child);
  rpc AssignGuardian(AssignGuardianRequest) returns (GuardianAck);
  rpc ListChildren(ListChildrenRequest) returns (Children);
  // Pairing: parent mints a code (CreatePairCode); the not-yet-enrolled child
  // redeems it (RedeemPairCode is unauthenticated — the code IS the credential).
  rpc CreatePairCode(CreatePairCodeRequest) returns (PairCode);
  rpc RedeemPairCode(RedeemPairCodeRequest) returns (PairResult);
}

// ---------------------------------------------------------------------------
// ClusterControl service — membership / health / work queue (bulwark-cluster)
// ---------------------------------------------------------------------------

// Role a node plays. Single binary, role chosen by flag (PLAN §1).
enum NodeRole {
  NODE_ROLE_UNSPECIFIED = 0;
  LB                    = 1; // load balancer / gateway
  WORKER                = 2; // analysis worker
  ALL_IN_ONE            = 3; // home single-node deployment
}

enum NodeState {
  NODE_STATE_UNSPECIFIED = 0;
  ALIVE                  = 1;
  SUSPECT                = 2; // SWIM suspect
  DEAD                   = 3;
  DRAINING               = 4; // graceful shutdown, finishing in-flight work
}

message NodeInfo {
  string   node_id   = 1;
  NodeRole role        = 2;
  string   address     = 3; // host:port (mTLS endpoint)
  NodeState state       = 4;
  uint64    incarnation = 5; // SWIM incarnation number
  repeated ExecutionProvider exec_providers = 6; // worker capability
  string    version     = 7;
}

message JoinRequest {
  NodeInfo node  = 1;
  repeated string seed_nodes = 2; // known cluster members to gossip with
}

message JoinResponse {
  bool     accepted   = 1;
  repeated NodeInfo members = 2; // current view at join time
  string   cluster_id  = 3;
  string   reason       = 4; // populated when accepted == false
}

message LeaveRequest {
  string node_id = 1;
  bool   graceful = 2; // true → drain first
}

message LeaveResponse {
  bool accepted = 1;
}

message HealthRequest {
  string node_id = 1; // empty = whole-cluster health
}

// Health snapshot for a node (or aggregate). Feeds LB + offload backpressure.
message HealthStatus {
  string    node_id        = 1;
  NodeState state           = 2;
  uint32    queue_depth      = 3; // pending work items
  uint32    inflight         = 4; // currently processing
  float     cpu_load         = 5; // 0.0–1.0
  float     gpu_load         = 6; // 0.0–1.0, 0 if no GPU
  uint64    mem_used_mb       = 7;
  uint32    p50_latency_ms     = 8;
  uint32    p99_latency_ms     = 9;
  bool      accepting_work     = 10; // false when quorum/heartbeat lost
  int64     ts                  = 11;
}

// One queued work item (an AnalysisRequest plus routing metadata).
message WorkItem {
  string          work_id   = 1;
  AnalysisRequest request    = 2;
  uint32          priority    = 3; // higher = sooner (live stream > VOD)
  int64           enqueued_ts = 4;
  uint32          attempts    = 5; // redelivery count
}

message EnqueueRequest {
  WorkItem item = 1;
}

message EnqueueResponse {
  string work_id          = 1;
  uint32 queue_position   = 2;
  bool   accepted          = 3; // false under backpressure → caller runs local
}

message DequeueRequest {
  string node_id        = 1; // claiming worker
  uint32 max_items       = 2;
  repeated ExecutionProvider provides = 3; // capability filter
  uint32 wait_ms          = 4; // long-poll timeout
}

message DequeueResponse {
  repeated WorkItem items = 1;
}

message DrainRequest {
  string node_id        = 1;
  uint32 deadline_secs   = 2; // finish in-flight within this, then DEAD
}

message DrainResponse {
  bool   accepted      = 1;
  uint32 inflight      = 2; // remaining when accepted
}

message WatchHealthRequest {
  string node_id           = 1; // empty = all nodes
  uint32 interval_ms        = 2; // desired push cadence
}

// Cluster membership, health, and work distribution. Postgres is the quorum
// source-of-truth (avoids split-brain); SWIM gossip rides this transport.
service ClusterControl {
  rpc Join(JoinRequest) returns (JoinResponse);
  rpc Leave(LeaveRequest) returns (LeaveResponse);
  rpc Health(HealthRequest) returns (HealthStatus);
  rpc WatchHealth(WatchHealthRequest) returns (stream HealthStatus);
  rpc Enqueue(EnqueueRequest) returns (EnqueueResponse);
  rpc Dequeue(DequeueRequest) returns (DequeueResponse);
  rpc Drain(DrainRequest) returns (DrainResponse);
}
