[package]
name = "bulwark-infer"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Local ONNX execution via `ort`. OFF by default: the routing logic, the gRPC
# offload client, and the unit tests all compile and run without a model
# runtime. Turning this on links `ort` so a capable device can run the small
# dedicated first-pass models locally instead of offloading (PLAN §0b: small
# dedicated task models only — this crate adds NO models of its own, it only
# drives the runtime when policy says "local").
onnx = ["dep:ort", "dep:bulwark-vision", "dep:ring"]

[dependencies]
bulwark-proto = { path = "../bulwark-proto" }
bulwark-core = { path = "../bulwark-core" }

tonic.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true

# Streaming support for AnalyzeStream (BoxStream in the Analyzer/router surface).
futures-core.workspace = true
futures-util.workspace = true

# Optional: real ONNX runtime, gated behind the `onnx` feature. Not required to
# build/test the router here.
ort = { workspace = true, optional = true }

# Shared image preprocessing (decode → NCHW tensor) + score postprocessing for
# the local first-pass model — the SAME pipeline as the live bulwark-vision
# path, so the on-device and server score conventions cannot drift. Pulled only
# by `onnx` builds (and WITHOUT bulwark-vision's own `onnx` feature: we drive
# our own session; the bundled vision model is not embedded here).
bulwark-vision = { path = "../bulwark-vision", optional = true }
# SHA-256 for Evidence.sha256 (hash-only audit of analysed media), mirroring
# bulwark-vision. Workspace dep, `onnx` builds only.
ring = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
# Synthetic in-memory PNG for the self-skipping live-model test (same crate the
# bulwark-vision tests use). Dev-only.
image = { version = "0.25", default-features = false, features = ["png"] }
