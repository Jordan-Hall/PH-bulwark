  "\\bjust (this|one) (once|time)\\b",
  "\\bprove (you|u) (like|trust|love) me\\b",
]

# CSAM-RISK: image requests. Highest weight by far (+5.0); a confirmed image
# request escalates the thread to CRITICAL via the engine.
[grooming.image_request]
phrases = [
  "send a picture",
  "send a pic",
  "send me a pic",
  "send me a picture",
  "send a photo",
  "send me a photo",
  "send a selfie",
  "send me a selfie",
  "take a selfie for me",
  "send a pic of you",
  "send nudes",
  "send a nude",
  "send me nudes",
  "send a naked pic",
  "without clothes",
  "with no clothes",
  "take it off",
  "take your clothes off",
  "show me your body",
  "a pic in your room",
  "a pic in your bedroom",
  "selfie in your room",
  "pic in the bathroom",
  "snap of you in bed",
]
patterns = [
  "\\bsend (me )?(a |some )?(pic|pics|picture|pictures|photo|photos|selfie|selfies|nude|nudes)\\b",
  "\\b(pic|picture|photo|selfie|snap) (of you )?(in|on) (your|the) (room|bedroom|bed|bathroom|shower)\\b",
  "\\b(with )?(no|without|out of your) clothes\\b",
]

# -- Adult-text (Category::ADULT_TEXT) -------------------------------------
# Simpler explicit-sexual-content lexicon. Distinct from grooming: this flags a
# message as adult/explicit text regardless of conversation state.
[adult_text]
phrases = [
  "explicit sex",
  "hardcore porn",
  "porn video",
  "watch porn",
  "let's have sex",
  "lets have sex",
  "send nudes",
  "naked photos",
  "blow job",
  "blowjob",
]
patterns = [
  "\\bporn(o|hub|graphy)?\\b",
  "\\b(hand|blow|rim)\\s?job\\b",
  "\\bfuck(ing|ed)?\\b",
]
